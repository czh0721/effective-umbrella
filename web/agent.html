<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#eceef5" />
  <title>Agent 工作台 — 念念</title>
  <link rel="stylesheet" href="/static/app.css" />
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg" />
  <link rel="apple-touch-icon" href="/static/icon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
</head>
<body>
  <div class="topbar">
    <a class="icon-btn" href="/app" aria-label="返回">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <b id="agentName" style="font-size:14px">加载中…</b>
    <div class="spacer"></div>
    <button class="btn small primary" id="activateBtn" style="display:none">设为当前</button>
  </div>
  <div class="shell stagger" id="workbench"></div>
  <div class="toasts"></div>
  <script src="/static/app.js"></script>
  <script>
    const personaId = Number(location.pathname.split("/").pop());
    let detail = null;
    let trainFiles = [];
    let debugContactNames = {};
    let debugHistory = [];
    let lastDebug = null;
    let debugBusy = false;

    function toastErr(error) {
      const message = error.message || String(error);
      toast(message);
      if ((error.status || 0) === 402 || /积分不足/.test(message)) {
        openModal(
          "积分不足",
          `<div class="mini" style="margin-bottom:12px">${escapeHtml(message || "蒸馏所需积分不足。")}</div>
           <button class="btn primary wide" id="goTickets">前往充值</button>`,
        );
        $("goTickets").onclick = () => { window.location.href = "/app/settings"; };
      }
    }
    function initials(name) { return escapeHtml((name || "?").slice(0, 1)); }
    function contactLabel(contact) {
      if (contact.display_name) return contact.display_name;
      const key = contact.contact_key || "";
      return key.length > 14 ? key.slice(0, 6) + "…" + key.slice(-4) : (key || "未知联系人");
    }
    function gradientFor(id) {
      const palettes = [
        "linear-gradient(145deg,#f472b6,#ec4899)",
        "linear-gradient(145deg,#a78bfa,#7c5cff)",
        "linear-gradient(145deg,#7c5cff,#9b7bff)",
        "linear-gradient(145deg,#38bdf8,#3d8bff)",
        "linear-gradient(145deg,#34d399,#28c46c)",
      ];
      return palettes[Number(id || 0) % palettes.length];
    }

    /* ------------------------------------------------------------- 通用 -- */
    function kv(label, value) {
      return `<div class="kv"><span class="k">${escapeHtml(label)}</span><span class="v">${escapeHtml(value || "未填写")}</span></div>`;
    }
    function listBlock(label, items) {
      const list = (items || []).filter(Boolean);
      return `<div class="field"><label>${escapeHtml(label)}</label><div class="chip-list">${
        list.length ? list.map((item) => `<span class="tag-chip">${escapeHtml(item)}</span>`).join("") : '<span class="hint">暂无</span>'
      }</div></div>`;
    }
    function row(act, iconName, title, sub, color) {
      return `<div class="g-row click" data-act="${act}">
        <span class="li-ico"${color ? ` style="color:${color}"` : ""}>${icon(iconName)}</span>
        <div class="g-text"><div class="g-title">${escapeHtml(title)}</div>${sub ? `<div class="g-sub">${escapeHtml(sub)}</div>` : ""}</div>
        <div class="spacer"></div><span class="chevron">›</span>
      </div>`;
    }
    function bindActions(root) {
      root.querySelectorAll("[data-act]").forEach((node) => {
        node.onclick = () => { const fn = ACTIONS[node.dataset.act]; if (fn) fn(); };
      });
    }

    /* ------------------------------------------------------- 工作台 -- */
    function renderSettings() {
      const s = detail.settings;
      const wx = detail.channel.wechat || {};
      const cardData = detail.card || {};
      const soul = cardData.soul || {};
      const running = Boolean(wx.running);
      const status = running ? "微信在线 · 自动回复中" : wx.bound ? "微信已绑定 · 未在线" : "微信未绑定";
      const styleTags = (soul.speaking_style || cardData.speaking_style || []).slice(0, 5);
      const catchphrases = (soul.catchphrases || cardData.favorite_phrases || []).slice(0, 3);
      const memCount = (cardData.memories || []).length;
      const proactive = s.proactive || {};
      const moments = s.moments || {};
      const safety = s.safety || {};
      const model = s.model || {};
      const voice = s.voice || {};
      const modelText = `${model.provider === "system" ? "系统默认" : model.provider} · 温度 ${model.temperature}`;
      const tuning = s.tuning || { verbosity: 50, warmth: 60, humor: 30 };
      const tuningText = `话量 ${tuning.verbosity} · 亲密 ${tuning.warmth} · 幽默 ${tuning.humor}`;
      const approvalStatus = detail.farewell
        ? row("farewell", "heart", "已好好告别", "查看那封告别信", "var(--pink)")
        : row("farewell", "heart", "好好告别", "让 ta 认真说一次再见，然后安静退场", "var(--pink)");
      const host = $("workbench");
      host.innerHTML = `
        <section class="glass card">
          <div class="row">
            ${detail.persona.avatar
              ? `<div class="avatar">${avatarImgMarkup(detail.persona.avatar)}</div>`
              : `<div class="avatar" style="background:${gradientFor(detail.persona.id)}">${initials(detail.persona.name)}</div>`}
            <div class="flex1">
              <b style="font-size:17px">${escapeHtml(detail.persona.name)}</b>
              <div class="row" style="gap:6px;margin-top:2px">
                <span class="dot ${running ? "ok" : ""}"></span>
                <span class="mini" style="color:${running ? "var(--green)" : "var(--text-3)"}">${escapeHtml(status)}</span>
              </div>
            </div>
            <button class="icon-btn" id="hubBtn" aria-label="更多">
              <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
            </button>
          </div>
        </section>

        <section class="glass card">
          <div class="lrow click" data-act="channel" style="margin:-6px -18px 0;padding:14px 18px">
            <span class="li-ico" style="background:rgba(40,196,108,.12);color:var(--green)">${icon("wechat")}</span>
            <div class="flex1"><b>微信渠道</b><div class="mini">${escapeHtml(wx.bound ? "已绑定" : "未绑定，点击扫码")}</div></div>
            <span class="switch" style="pointer-events:none"><input type="checkbox" ${running ? "checked" : ""} /><span class="track"></span></span>
          </div>
          <div class="stat3" style="margin-top:14px">
            <div><b data-count="${detail.turn_count || 0}">0</b><span>对话轮次</span></div>
            <div><b data-count="${memCount}">0</b><span>人格记忆</span></div>
            <div><b data-count="${(detail.stickers || []).length}">0</b><span>表情包</span></div>
          </div>
        </section>

        <section class="glass card">
          <div class="row" style="margin-bottom:4px">
            <b class="flex1" style="font-size:13.5px">人格档案</b>
            <button class="btn small ghost" data-act="edit">编辑</button>
          </div>
          <div class="chip-list" style="margin-top:10px">
            ${styleTags.length ? styleTags.map((t) => `<span class="tag-chip">${escapeHtml(t)}</span>`).join("") : '<span class="tag-chip">待提炼</span>'}
          </div>
          <p class="muted" style="margin-top:11px;font-size:12.5px">${catchphrases.length ? "口头禅：" + catchphrases.map((x) => "「" + escapeHtml(x) + "」").join("") : "还没有提炼出说话风格"}</p>
        </section>

        <section class="glass card" style="padding-bottom:6px">
          <b style="font-size:13.5px">能力设置</b>
          <div style="margin:4px -18px 0">
            ${row("proactive", "clock", "主动消息", proactive.enabled ? (proactive.mode === "smart" ? "智能触发" : `每 ${proactive.interval_hours} 小时`) : "未开启", "var(--orange)")}
            ${row("moments", "moments", "朋友圈", moments.enabled ? `每天最多 ${moments.max_per_day} 条` : "未开启", "var(--v2)")}
            ${row("safety", "warning", "防封与安全", safety.enabled ? "拟人节奏 · 敏感词 · 掉线提醒" : "已关闭", "var(--orange)")}
            ${row("model", "cpu", "大模型", modelText, "var(--v)")}
            ${row("tuning", "sliders", "人格调校", tuningText, "var(--pink)")}
            ${row("advanced", "sliders", "消息与回复", "合并 · 分段 · 输入中 · 沉默", "#8e8e99")}
            ${row("stickers", "sticker", "图片表情包", (detail.stickers || []).length ? `${detail.stickers.length} 个` : "还没有表情包", "var(--v2)")}
            ${row("voice", "mic", "语音", (s.advanced || {}).reply_voice ? "语音回复已开启" : "未开启", "var(--blue)")}
          </div>
        </section>

        <section class="glass card" style="padding-bottom:6px">
          <b style="font-size:13.5px">回忆与告别</b>
          <div style="margin:4px -18px 0">
            ${row("timeline", "clock", "回忆时间线", "把你们的聊天、记忆与主动消息串成一条线", "var(--blue)")}
            ${approvalStatus}
          </div>
        </section>

        <section class="glass card">
          <div class="row" style="margin-bottom:10px">
            <b class="flex1" style="font-size:13.5px">调试对话（模拟微信联系人）</b>
            <span class="badge b-ok">不写库</span>
          </div>
          <div id="dbgChat"></div>
          <div class="field" style="margin-top:8px">
            <select id="dbgContact" aria-label="选择联系人"><option value="">默认联系人</option></select>
          </div>
          <div class="inp" style="margin-top:6px">
            <input id="dbgMsg" placeholder="输入测试消息…" autocomplete="off" />
            <button class="card-del" id="dbgSend" aria-label="发送" style="color:var(--v)">
              <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M3 11 21 3l-8 18-2-8z"/></svg>
            </button>
          </div>
        </section>
      `;
      $("hubBtn").onclick = openPersonaHub;
      bindActions(host);
      const input = $("dbgMsg");
      const send = () => runDebug(input.value.trim());
      $("dbgSend").onclick = send;
      input.addEventListener("keydown", (event) => { if (event.key === "Enter") send(); });
      renderDebugChat();
      loadDebugTargets();
      revealInit(host);
      animateCounts(host);
    }

    function renderDebugChat() {
      const host = $("dbgChat");
      if (!host) return;
      if (!debugHistory.length) {
        host.innerHTML = `<div class="bub ta">在干嘛呀</div><div class="bub me">刚忙完工作，正想你呢～你今天累不累呀</div>`;
        return;
      }
      host.innerHTML = debugHistory.map((m) => m.silenced
        ? `<div class="mini" style="text-align:center;margin:6px 0">（判定为不想回复，实际不会发出）</div>`
        : `<div class="bub ${m.role === "me" ? "me" : "ta"}">${escapeHtml(m.text)}</div>`
      ).join("") + (lastDebug ? `<button class="btn small ghost wide" id="traceBtn" style="margin-top:6px">查看完整链路</button>` : "");
      const traceBtn = $("traceBtn");
      if (traceBtn) traceBtn.onclick = showTrace;
    }

    function showTrace() {
      if (!lastDebug) return;
      openSheet("调试链路", "召回记忆、历史与系统提示", '<div id="traceBox"></div>', (body) => {
        renderTrace(body.querySelector("#traceBox"), lastDebug.data, lastDebug.peer, lastDebug.message);
      });
    }

    function renderTrace(host, data, peerLabel, sentMessage) {
      const pills = [
        `<span class="pill"><span class="dot ${data.ready ? "ok" : "err"}"></span>${data.ready ? "模型已就绪" : "模型未就绪"}</span>`,
        `<span class="pill">${escapeHtml(data.provider)}</span>`,
        data.model ? `<span class="pill">${escapeHtml(data.model)}</span>` : "",
        `<span class="pill">${escapeHtml(data.channel.running ? "微信在线" : "微信未在线")}</span>`,
        `<span class="pill">记忆 ${data.memory_total} 条</span>`,
      ].join("");
      const hits = (data.memory_hits || []).length
        ? data.memory_hits.map((m) => `<span class="tag-chip">${escapeHtml(m.content)}</span>`).join("")
        : '<span class="hint">这次没有召回记忆</span>';
      const peer = peerLabel || "对方";
      const selfName = (detail.persona && detail.persona.name) || "TA";
      const history = (data.history || []).length
        ? data.history.map((t) => `<div class="kv"><span class="k">${escapeHtml(t.role === "user" ? peer : selfName)}</span><span class="v">${escapeHtml(t.content)}</span></div>`).join("")
        : '<div class="hint">还没有历史轮次</div>';
      host.innerHTML = `
        <div class="dbg-row">${pills}</div>
        ${data.error ? `<div class="hint" style="color:var(--orange);margin-top:10px">${escapeHtml(data.error)}</div>` : ""}
        <div class="dbg-label">${escapeHtml(peer)}</div>
        <div class="dbg-echo">${escapeHtml(sentMessage || "")}</div>
        <div class="dbg-trace">
          <details open><summary>召回的记忆 <span class="count">${(data.memory_hits || []).length} 条</span></summary><div class="body"><div class="chip-list">${hits}</div></div></details>
          <details><summary>用到的历史 <span class="count">${data.history_count} 轮</span></summary><div class="body">${history}</div></details>
          <details><summary>系统提示 <span class="count">人设与记忆</span></summary><div class="body"><pre class="codeblock">${escapeHtml(data.system_prompt || "")}</pre></div></details>
        </div>`;
    }

    async function loadDebugTargets() {
      try {
        const mem = await api(`/api/personas/${personaId}/memories`);
        debugContactNames = {};
        (mem.contacts || []).forEach((c) => { debugContactNames[c.contact_key] = contactLabel(c); });
        const select = $("dbgContact");
        if (select) {
          const current = select.value;
          const defaultContact = (detail.persona && detail.persona.last_contact) || "";
          const options = Object.keys(debugContactNames).map((key) =>
            `<option value="${escapeHtml(key)}">${escapeHtml(debugContactNames[key])}</option>`).join("");
          const defaultLabel = defaultContact && debugContactNames[defaultContact] ? "（" + escapeHtml(debugContactNames[defaultContact]) + "）" : "";
          select.innerHTML = `<option value="">默认联系人${defaultLabel}</option>` + options;
          if (current && [...select.options].some((o) => o.value === current)) select.value = current;
        }
      } catch (error) { /* 忽略 */ }
    }

    async function runDebug(message) {
      if (debugBusy) return;
      if (!message) { toast("先写一句话"); return; }
      const input = $("dbgMsg");
      const button = $("dbgSend");
      const contactSelect = $("dbgContact");
      const contact = contactSelect ? contactSelect.value : "";
      input.value = "";
      debugHistory.push({ role: "me", text: message });
      renderDebugChat();
      debugBusy = true;
      if (button) button.disabled = true;
      try {
        const data = await api(`/api/personas/${personaId}/debug`, { method: "POST", body: JSON.stringify({ message, contact }) });
        const defaultContact = contact || (detail.persona && detail.persona.last_contact) || "";
        const peer = debugContactNames[defaultContact] || "对方";
        lastDebug = { data, peer, message };
        if (data.silenced) debugHistory.push({ role: "ta", text: "", silenced: true });
        else debugHistory.push({ role: "ta", text: data.reply || "（空回复）" });
        renderDebugChat();
      } catch (error) { toastErr(error); }
      finally { debugBusy = false; if (button) button.disabled = false; }
    }

    function openPersonaHub() {
      const styleText = ((detail.card || {}).soul || {}).speaking_style || [];
      openSheet("人设", styleText.slice(0, 4).join("、") || "塑造 ta 的身份、记忆与说话方式", `
        <div class="group-title">了解与修改</div>
        <div class="setting-group glass">
          ${row("profile", "spark", "人设档案", "查看 ta 的身份、性格与共同回忆")}
          ${row("edit", "edit", "编辑人设", "逐项修改身份与共同回忆")}
        </div>
        <div class="group-title">训练与打磨</div>
        <div class="setting-group glass">
          ${row("train", "download", "训练素材", "上传聊天记录 / 照片并解析")}
          ${row("redistill", "brain", "AI 重新生成", "分析素材，更新身份与说话方式")}
        </div>
        <div class="group-title">记忆与会话</div>
        <div class="setting-group glass">
          ${row("memories", "heart", "长期记忆", "按聊天对象查看与清理")}
          ${row("timeline", "clock", "回忆时间线", "把聊天、记忆与主动消息串成一条线")}
          ${row("reset", "plus", "开启新会话", "清空上下文，人设保留")}
          ${row("farewell", "heart", "好好告别", "认真说一次再见，然后安静退场", "var(--pink)")}
        </div>
        <div class="group-title">危险操作</div>
        <div class="setting-group glass">
          ${row("delete", "trash", "删除该 Agent", "人格与素材会移出，不可撤销", "var(--red)")}
        </div>`, (body) => {
        bindActions(body);
      });
    }

    /* --------------------------------------------------------- 人设 -- */
    function renderCardTab(card, tab) {
      if (tab === "identity") {
        const identity = card.identity || {};
        return kv("姓名", identity.name) + kv("性别", identity.gender) + kv("生日", identity.birthday) +
          kv("年龄", identity.age) + kv("籍贯", identity.hometown) + kv("学历", identity.education);
      }
      if (tab === "user") {
        const u = card.user || {};
        return kv("和 TA 的关系", u.relationship) + kv("认识时间", u.met_time);
      }
      if (tab === "soul") {
        const soul = card.soul || {};
        return listBlock("说话风格", soul.speaking_style || card.speaking_style) +
          listBlock("口头禅", soul.catchphrases || card.favorite_phrases) +
          listBlock("性格特质", card.personality);
      }
      const memories = card.memories || [];
      return memories.length
        ? memories.map((item) => kv(item.title || item.time || "回忆", item.detail)).join("")
        : '<div class="hint">还没有共同回忆。</div>';
    }

    function openProfile() {
      openSheet("人设档案", detail.persona.name + " 是谁", `
        <div class="tabs" id="pTab">
          <button class="tab active" data-tab="identity">身份</button>
          <button class="tab" data-tab="user">用户</button>
          <button class="tab" data-tab="soul">灵魂</button>
          <button class="tab" data-tab="memory">共同回忆</button>
        </div>
        <div id="pBody" style="margin-top:16px"></div>`,
        (body) => {
          const draw = (tab) => { body.querySelector("#pBody").innerHTML = renderCardTab(detail.card || {}, tab); };
          body.querySelectorAll("#pTab .tab").forEach((tab) => {
            tab.onclick = () => {
              body.querySelectorAll("#pTab .tab").forEach((t) => t.classList.toggle("active", t === tab));
              refreshSegment(body.querySelector("#pTab"));
              draw(tab.dataset.tab);
            };
          });
          draw("identity");
        });
    }

    function openEdit() {
      const card = detail.card || {};
      const identity = card.identity || {};
      const user = card.user || {};
      const soul = card.soul || {};
      const memories = (card.memories || []).map((m) => [m.time, m.title, m.detail].map((x) => x || "").join(" | ")).join("\n");
      let avatarData = null;
      let avatarReset = false;
      openSheet("手动编辑人设", "逐项修改身份档案", `
        <div class="profile-edit-head">
          <button class="avatar avatar-lg" id="eAvatar" type="button" aria-label="更换头像"></button>
          <div class="mini">点击更换头像 · <a href="javascript:void(0)" id="eAvatarReset">恢复默认</a></div>
          <input type="file" id="eAvatarFile" accept="image/*" hidden />
        </div>
        <div class="split"><div class="field"><label>姓名</label><input id="eName" value="${escapeHtml(identity.name || detail.persona.name)}" /></div>
        <div class="field"><label>性别</label><input id="eGender" value="${escapeHtml(identity.gender || "")}" /></div></div>
        <div class="split"><div class="field"><label>生日</label><input id="eBirthday" value="${escapeHtml(identity.birthday || "")}" /></div>
        <div class="field"><label>年龄</label><input id="eAge" value="${escapeHtml(identity.age || "")}" /></div></div>
        <div class="split"><div class="field"><label>籍贯</label><input id="eHometown" value="${escapeHtml(identity.hometown || "")}" /></div>
        <div class="field"><label>学历</label><input id="eEducation" value="${escapeHtml(identity.education || "")}" /></div></div>
        <div class="split"><div class="field"><label>和 TA 的关系</label><input id="eRelation" value="${escapeHtml(user.relationship || "")}" /></div>
        <div class="field"><label>认识时间</label><input id="eMet" value="${escapeHtml(user.met_time || "")}" /></div></div>
        <div class="field"><label>说话风格（逗号分隔）</label><input id="eStyle" value="${escapeHtml((soul.speaking_style || card.speaking_style || []).join("，"))}" /></div>
        <div class="field"><label>口头禅（逗号分隔）</label><input id="ePhrases" value="${escapeHtml((soul.catchphrases || card.favorite_phrases || []).join("，"))}" /></div>
        <div class="field"><label>共同回忆（每行：时间 | 标题 | 描述）</label><textarea id="eMemories" placeholder="2019 | 初见 | 在书店认识">${escapeHtml(memories)}</textarea></div>
        <div class="btnrow"><button class="btn primary wide" id="eSave">保存</button></div>`,
        (body, mask) => {
          const av = body.querySelector("#eAvatar");
          const file = body.querySelector("#eAvatarFile");
          const paintAvatar = (avatar) => {
            if (avatar) {
              av.style.background = "";
              av.innerHTML = avatarImgMarkup(avatar);
            } else {
              av.style.background = gradientFor(detail.persona.id);
              av.textContent = (detail.persona.name || "?").slice(0, 1);
            }
          };
          paintAvatar(detail.persona.avatar || "");
          av.onclick = () => file.click();
          file.onchange = async () => {
            if (!file.files || !file.files[0]) return;
            try {
              avatarData = await compressAvatarFile(file.files[0]);
              avatarReset = false;
              paintAvatar(avatarData);

    function speak(text) {
      if (!text) { toast("没有可朗读的内容"); return; }
      if (!window.speechSynthesis) { toast("当前浏览器不支持语音朗读"); return; }
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "zh-CN";
        utter.rate = 0.98;
        window.speechSynthesis.speak(utter);
      } catch (error) { toast("朗读失败"); }
    }

          <div class="g-row"><span class="li-ico" style="background:rgba(18,183,245,.12);color:var(--qq)">${icon("qq")}</span><div class="g-text"><div class="g-title">QQ</div><div class="g-sub">渠道开发中</div></div></div>
        </div>
        <div id="chQr"></div>
        <div class="btnrow">
          <button class="btn primary" id="chLogin">扫码登录</button>
          <button class="btn ghost" id="chStop">断开连接</button>
        </div>`,
        (body) => {
          const mask = body.closest(".modal-mask");
          let timer = null;
          let lastQrSeq = "";
          const applyStatus = (status) => {
            body.querySelector("#chPhase").textContent = channelStatusText(status);
            const state = body.querySelector("#chState");
            const bound = wx.bound || status.phase === "logged-in" || status.phase === "running";
            state.innerHTML = status.running ? '<span class="dot ok"></span>在线' : bound ? '<span class="dot warn"></span>已绑定' : '<span class="dot"></span>未绑定';
            const channel = detail.channel.wechat;
            const changed = channel.running !== !!status.running || channel.bound !== bound;
            channel.running = !!status.running;
            channel.bound = bound;
            if (status.phase) channel.phase = status.phase;
            if (changed) renderSettings();
            if (status.qr_svg && status.qr_seq && status.qr_seq !== lastQrSeq) {
              lastQrSeq = status.qr_seq;
              body.querySelector("#chQr").innerHTML = '<div class="qr">' + status.qr_svg + "</div>";
            }
          };
          const loadVerbose = async () => {
            const status = await api("/api/wechat/status?verbose=1");
            applyStatus(status);
            return status;
          };
          const refresh = async () => {
            if (!document.body.contains(mask)) { if (timer) clearInterval(timer); return; }
            try {
              const status = await api("/api/wechat/status");
              applyStatus(status);
              if (status.qr_seq && status.qr_seq !== lastQrSeq) await loadVerbose();
            } catch (error) { body.querySelector("#chPhase").textContent = error.message; }
          };
          const startPolling = () => { if (!timer) timer = setInterval(refresh, 4000); };
          body.querySelector("#chLogin").onclick = async () => {
            const button = body.querySelector("#chLogin");
            if (button.disabled) return;
            button.disabled = true;
            try { const status = await api("/api/wechat/login", { method: "POST" }); applyStatus(status); startPolling(); } catch (error) { toastErr(error); } finally { button.disabled = false; }
          };
          body.querySelector("#chStop").onclick = async () => {
            const button = body.querySelector("#chStop");
            if (button.disabled) return;
            button.disabled = true;
            try { await api("/api/wechat/stop", { method: "POST" }); toast("已断开"); await refresh(); } catch (error) { toastErr(error); } finally { button.disabled = false; }
          };
          loadVerbose().catch(() => {});
          startPolling();
        });
    }

    const NODE_META = {
      morning: { label: "早安问候", desc: "每天早上到点先开口" },
      goodnight: { label: "晚安问候", desc: "晚上睡前道一声晚安" },

    function nodeExtra(kind, node) {
      if (kind === "morning" || kind === "goodnight") {
        return `<input type="time" id="nd_${kind}_time" value="${escapeHtml(node.time || (kind === "morning" ? "08:30" : "22:30"))}" />`;
      }
      if (kind === "anniversary") {
        return `<span class="mini">日期</span><input id="nd_${kind}_date" placeholder="MM-DD" value="${escapeHtml(node.date || "01-01")}" style="width:76px" />`;
      }
      if (kind === "care") {
        return `<span class="mini">沉默</span><input type="number" id="nd_${kind}_idle" min="6" max="720" value="${Number(node.idle_hours || 48)}" style="width:70px" /><span class="mini">小时</span>`;
      }
      return "";
    }

    function nodeRows(nodes) {
      const byKind = {};
      (nodes || []).forEach((node) => { byKind[node.kind] = node; });
      return Object.keys(NODE_META).map((kind) => {
        const node = byKind[kind] || { kind, enabled: false };
        const meta = NODE_META[kind];
        return `<div class="setting-row">
          <div><div class="label">${escapeHtml(meta.label)}</div><div class="desc">${escapeHtml(meta.desc)}</div></div>
          <div class="spacer"></div>
          ${nodeExtra(kind, node)}
          <span class="switch"><input type="checkbox" id="nd_${kind}_on" ${node.enabled ? "checked" : ""} /><span class="track"></span></span>
        </div>`;
      }).join("");
    }

    function collectNodes(body) {
      return Object.keys(NODE_META).map((kind) => {
        const node = { kind, enabled: body.querySelector("#nd_" + kind + "_on").checked };
        if (kind === "morning" || kind === "goodnight") node.time = body.querySelector("#nd_" + kind + "_time").value || "";
        if (kind === "anniversary") node.date = body.querySelector("#nd_" + kind + "_date").value.trim();
        if (kind === "care") node.idle_hours = Number(body.querySelector("#nd_" + kind + "_idle").value) || 48;
        return node;
      });
    }

          <button class="btn" id="vClone">克隆音色（${cost} 积分）</button>
        </div>
        <div class="desc">可上传本地音频（mp3/wav/m4a/amr 等），单条不超过 5MB、120 秒；上传前请先选择克隆对象。</div>
        <div class="btnrow"><button class="btn primary wide" id="vSave">保存</button></div>`,
        (body, mask) => {
          body.querySelector("#vSave").onclick = async () => {
            const chosen = body.querySelector("#vPreset").value;
            await saveSettings({
              voice: { preset: chosen, voice: chosen },
              advanced: { reply_voice: body.querySelector("#vReply").checked },
            });
            closeModal(mask);
          };
          const fileInput = body.querySelector("#vFile");
          const uploadButton = body.querySelector("#vUpload");
          uploadButton.onclick = () => fileInput.click();
          fileInput.onchange = async () => {
            const files = Array.from(fileInput.files || []);
            if (!files.length) return;
            const selected = body.querySelector("#vContact").value;
            if (!selected) { toast("请先选择要克隆的联系人"); fileInput.value = ""; return; }
            uploadButton.disabled = true;
            let done = 0;
            let failed = 0;
            try {
              for (const file of files) {
                const form = new FormData();
                form.append("file", file, file.name || "audio");
                form.append("contact", selected);
                try {
                  await api(`/api/personas/${personaId}/voice/samples`, { method: "POST", body: form });
                  done += 1;
                } catch (error) { failed += 1; toastErr(error); }
              }
              if (done) toast(`已上传 ${done} 条语音样本${failed ? `，${failed} 条失败` : ""}`);
              if (done) { closeModal(mask); openVoice(); }
            } finally { uploadButton.disabled = false; }
          };
          body.querySelector("#vPreview").onclick = async () => {
            const button = body.querySelector("#vPreview");
            button.disabled = true;
            try { await playVoicePreview(`/api/personas/${personaId}/voice/preview`, {}); }
            catch (error) { toastErr(error); }
            finally { button.disabled = false; }
          };
          body.querySelector("#vClone").onclick = async () => {
            const selected = body.querySelector("#vContact").value;
            if (!selected) { toast("请先选择要克隆的联系人"); return; }
            if (!body.querySelector("#vConsent").checked) { toast("请先确认已获得声音权利人同意"); return; }
            const button = body.querySelector("#vClone");
            button.disabled = true;
            try {
              await api(`/api/personas/${personaId}/voice/clone`, {
                method: "POST", body: JSON.stringify({ contact: selected, consent: true }),
              });
              closeModal(mask);
              toast("已开始克隆，稍后可回到这里查看状态");
              openVoice();
            } catch (error) { toastErr(error); button.disabled = false; }
          };
        });
    }

    function openDevice() {
      const d = detail.settings.device;
      openSheet("智能设备", "手表、音箱等（开发中）", `
        ${switchRow("启用设备联动", "", d.enabled, 'id="dEnabled"')}
        <div class="field"><label>设备类型</label><input id="dType" placeholder="例如：智能手表" value="${escapeHtml(d.type || "")}" /></div>
        <div class="hint">该能力仍在开发中，设置会被保存，接入后自动生效。</div>
        <div class="btnrow"><button class="btn primary wide" id="dSave">保存</button></div>`,
        (body, mask) => {
          body.querySelector("#dSave").onclick = async () => {
            await saveSettings({ device: { enabled: body.querySelector("#dEnabled").checked, type: body.querySelector("#dType").value.trim() } });
            closeModal(mask);
          };
        });
    }

    /* --------------------------------------------------------- 反馈 -- */
    function openFeedback() {
      openModal("问题反馈交流", `
        <div class="sub">遇到问题或有想法，写下告诉我们。</div>
        <div class="field"><label>反馈内容</label><textarea id="fbText" placeholder="描述遇到的问题、期望的功能或使用感受…"></textarea></div>
        <div class="btnrow"><button class="btn primary wide" id="fbSend">提交反馈</button></div>`,
        (body, mask) => {
          body.querySelector("#fbSend").onclick = async () => {
            const content = body.querySelector("#fbText").value.trim();
            if (!content) { toast("请先填写反馈内容"); return; }
            const button = body.querySelector("#fbSend");
            button.disabled = true;
            try {
              await api(`/api/personas/${personaId}/feedback`, { method: "POST", body: JSON.stringify({ content }) });
              closeModal(mask); toast("感谢反馈");
            } catch (error) { toastErr(error); }
            finally { button.disabled = false; }
          };
        });
    }

    /* --------------------------------------------------------- 动作 -- */
    async function doReset() {
      if (!confirm("新会话会清空这个 Agent 记住的上下文，人设保留，确定？")) return;
      await api(`/api/personas/${personaId}/reset`, { method: "POST" });
      await load(); toast("已开启新会话");
    }
    async function doDelete() {
      if (!confirm("确定删除这个 Agent？该操作不可撤销。")) return;
      await api(`/api/personas/${personaId}`, { method: "DELETE" });
      window.location.href = "/app";
    }
    async function doActivate() {
      await api(`/api/personas/${personaId}/activate`, { method: "POST" });
      await load(); toast("已设为当前使用");
    }
    const ACTIONS = {
      feedback: openFeedback,
      profile: openProfile, edit: openEdit, redistill: openRedistill, train: openTrain,
      model: openModel, memories: openMemoryList, channel: openChannel, proactive: openProactive,
      moments: openMoments,
      stickers: openStickers, advanced: openAdvanced, safety: openSafety, voice: openVoice, device: openDevice,
      tuning: openTuning, timeline: openTimeline, farewell: openFarewell,
      reset: doReset, delete: doDelete,
    };

    /* --------------------------------------------------------- 渲染 -- */
    async function saveSettings(patch) {
      const result = await api(`/api/personas/${personaId}/settings`, { method: "PUT", body: JSON.stringify({ settings: patch }) });
      detail.settings = result.settings;
      render(); toast("已保存");
    }

    function render() {
      const persona = detail.persona;
      $("agentName").textContent = persona.name;
      $("activateBtn").style.display = persona.is_active ? "none" : "";
      document.title = persona.name + " — 念念";
      renderSettings();
    }

    async function load() {
      detail = await api(`/api/personas/${personaId}`);
      render();
      if (location.hash === "#channel") {
        history.replaceState(null, "", location.pathname + location.search);
        openChannel();
      }
    }

    $("activateBtn").onclick = doActivate;
    mountTabbar("/app");
    load().catch(toastErr);
    mountNotifications();
  </script>
</body>
</html>
