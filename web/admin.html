    /* ------------------------------------------------------------ helpers */
    function fmtTime(value) {
      if (!value) return "-";
      const date = new Date(value);
      return isNaN(date) ? String(value) : date.toLocaleString("zh-CN", { hour12: false });
    }
    function fmtShort(value) {
      if (!value) return "-";
      const date = new Date(value);
      if (isNaN(date)) return String(value);
      const p = (n) => String(n).padStart(2, "0");
      return `${date.getMonth() + 1}/${date.getDate()} ${p(date.getHours())}:${p(date.getMinutes())}`;
    }
    function fmtRelative(value) {
      const date = new Date(value);
      if (isNaN(date)) return "-";
      const diff = Math.max(0, Date.now() - date.getTime());
      const m = Math.floor(diff / 60000);
      if (m < 1) return "刚刚";
      if (m < 60) return m + " 分钟前";
      const h = Math.floor(m / 60);
      if (h < 24) return h + " 小时前";
      return Math.floor(h / 24) + " 天前";
    }
    function fmtUptime(seconds) {
      const s = Math.max(0, Math.floor(seconds || 0));
      const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
      if (d) return `${d} 天 ${h} 小时`;
      if (h) return `${h} 小时 ${m} 分`;
      return `${m} 分 ${s % 60} 秒`;
    }
    function segmentOf() { return (location.hash || "#overview").slice(1) || "overview"; }
    function emptyState(text, name) {
      return `<div class="empty">${name ? icon(name) : ""}${escapeHtml(text)}</div>`;
    }
    function headIcon(name, title, extra) {
      return `${icon(name)}<h2>${escapeHtml(title)}</h2>${extra || ""}`;
    }
    function validityOptions(selected) {
      const value = Number(selected) || 30;
      const labels = { 30: "月度", 90: "季度", 365: "年度" };
      return [30, 90, 365].map((days) => `<option value="${days}"${days === value ? " selected" : ""}>${labels[days]}（${days} 天）</option>`).join("");
    }

    /* ------------------------------------------------------------- charts */
    function donutChart(segments, opts) {
      opts = opts || {};
      const size = opts.size || 176, thickness = opts.thickness || 18;
      const r = (size - thickness) / 2, c = 2 * Math.PI * r;
      const total = segments.reduce((sum, item) => sum + (Number(item.value) || 0), 0);
      const live = segments.filter((item) => (Number(item.value) || 0) > 0);
      const gap = live.length > 1 ? 3 : 0;
      let offset = 0;
      const arcs = live.map((item) => {
        const value = Number(item.value) || 0;
        const frac = total > 0 ? value / total : 0;
        const len = Math.max(0.4, frac * c - gap);
        const el = `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${item.color}" stroke-width="${thickness}"
          stroke-dasharray="${len.toFixed(2)} ${(c - len).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}"
          stroke-linecap="round" transform="rotate(-90 ${size / 2} ${size / 2})"/>`;
        offset += frac * c;
        return el;
      }).join("");
      const track = `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="rgba(120,120,150,.14)" stroke-width="${thickness}"/>`;
      const centerValue = opts.centerValue != null ? opts.centerValue : total;
      return `<div class="donut-wrap">
        <div class="donut" style="width:${size}px;height:${size}px">
          <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${track}${arcs}</svg>
          <div class="center"><b>${escapeHtml(String(centerValue))}</b><span>${escapeHtml(String(opts.centerLabel || ""))}</span></div>
        </div>
        <div class="legend">${segments.map((item) => `
          <div class="legend-row">
            <span class="dot" style="background:${item.color}"></span>
            <span class="nm">${escapeHtml(item.label)}</span>
            <span class="vl">${escapeHtml(String(item.value))}</span>
            <span class="pc">${total ? Math.round(((Number(item.value) || 0) / total) * 100) : 0}%</span>
          </div>`).join("")}</div>
      </div>`;
    }

    function ringGauge(value, max, opts) {
      opts = opts || {};
      const size = opts.size || 112, stroke = opts.stroke || 10;
      const r = (size - stroke) / 2, c = 2 * Math.PI * r;
      const ratio = max > 0 ? Math.min(1, Math.max(0, value / max)) : 0;
      const dash = c * ratio;
      const color = opts.color || "#7c5cff";
      return `<div class="gauge">
        <div class="donut" style="width:${size}px;height:${size}px">
          <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
            <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="rgba(120,120,150,.14)" stroke-width="${stroke}"/>
            <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
              stroke-dasharray="${dash.toFixed(2)} ${(c - dash).toFixed(2)}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
          </svg>
          <div class="center"><b style="font-size:20px">${escapeHtml(String(opts.centerValue != null ? opts.centerValue : Math.round(ratio * 100) + "%"))}</b><span>${escapeHtml(String(opts.centerLabel || ""))}</span></div>
        </div>
        <div class="cap">${escapeHtml(opts.cap || "")}</div>
      </div>`;
    }

    function hbarList(items, opts) {
      opts = opts || {};
      if (!items.length) return emptyState(opts.empty || "暂无数据", opts.emptyIcon);
      const max = Math.max.apply(null, items.map((item) => item.value).concat([1]));
      return `<div class="hbars">${items.map((item) => `
        <div class="hbar ${item.tone || ""}">
          <span class="nm" title="${escapeHtml(item.label)}">${escapeHtml(item.label)}</span>
          <span class="track"><i style="width:${Math.max(2, Math.round((item.value / max) * 100))}%"></i></span>
          <span class="vl">${escapeHtml(String(item.value))}</span>
        </div>`).join("")}</div>`;
    }

    function lineChart(items, series, opts) {
      opts = opts || {};
      if (!items || !items.length) return emptyState(opts.empty || "暂无数据", "spark");
      const w = opts.width || 680, h = opts.height || 200;
      const padL = 30, padR = 14, padT = 16, padB = 26;
      const innerW = w - padL - padR, innerH = h - padT - padB;
      const max = Math.max(1, ...items.flatMap((row) => series.map((s) => Number(row[s.key]) || 0)));
      const stepX = items.length > 1 ? innerW / (items.length - 1) : innerW;
      const px = (i) => padL + i * stepX;
      const py = (v) => padT + innerH - (v / max) * innerH;
      const grid = [0, 0.25, 0.5, 0.75, 1].map((f) =>
        `<line x1="${padL}" y1="${(padT + innerH * f).toFixed(1)}" x2="${w - padR}" y2="${(padT + innerH * f).toFixed(1)}" stroke="rgba(120,120,150,.12)" />`).join("");
      const paths = series.map((s) => {
        const points = items.map((row, i) => `${px(i).toFixed(1)},${py(Number(row[s.key]) || 0).toFixed(1)}`).join(" ");
        return `<polyline fill="none" stroke="${s.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="${points}" />`;
      }).join("");
      const every = Math.max(1, Math.ceil(items.length / 6));
      const labels = items.map((row, i) => (i % every === 0 || i === items.length - 1)
        ? `<text x="${px(i).toFixed(1)}" y="${h - 8}" text-anchor="middle" font-size="10" fill="rgba(90,90,120,.72)">${escapeHtml(String(row.date || "").slice(5))}</text>` : "").join("");
      const legend = series.map((s) => `<span class="lg"><i style="background:${s.color}"></i>${escapeHtml(s.label)}</span>`).join("");
      return `<div class="linechart"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${grid}${paths}${labels}</svg>
        <div class="lg-row">${legend}<span class="max">峰值 ${max}</span></div></div>`;
    }

    function kpiCard(config) {
      const tone = TONE[config.tone] || TONE.v;
      const ratio = config.ratio != null ? Math.min(100, Math.max(0, config.ratio)) : null;
      return `<div class="kpi" style="--tone:${tone.color};--tone-soft:${tone.soft}">
        <div class="top">
          <div class="tile">${icon(config.icon)}</div>
          ${config.badge ? `<span class="delta">${escapeHtml(config.badge)}</span>` : ""}
        </div>
        <div class="n" data-count="${Number(config.value) || 0}">0</div>
        <div class="l">${escapeHtml(config.label)}</div>
        ${ratio != null ? `<div class="track"><i style="width:${ratio}%"></i></div>` : ""}
      </div>`;
    }

    /* ----------------------------------------------------------- sections */
    function setSection(name) {
      if (!TABS.some((tab) => tab.key === name)) name = "overview";
      state.section = name;
      const meta = TABS.find((tab) => tab.key === name);
      document.querySelectorAll("#sideNav button").forEach((btn) => btn.classList.toggle("active", btn.dataset.tab === name));
      document.querySelectorAll(".panel").forEach((panel) => panel.classList.toggle("on", panel.id === "panel-" + name));
      $("pageTitle").textContent = meta.title;
      const desc = meta.desc || "";
      $("pageDesc").textContent = desc;
      $("pageDesc").style.display = desc ? "" : "none";
      closeNav();
      revealInit();
      if (name === "system" && !state.logItems.length) loadLogs();
    }

    /* ----------------------------------------------------------- overview */
    function todayCalls() {
      return (((state.summary || {}).platform_usage || {}).by_user || []).reduce((sum, item) => sum + (item.n || 0), 0);
    }

    function renderOverview() {
      const summary = state.summary || {};
      const outbox = (summary.outbox && summary.outbox.counts) || {};

        ["累计消耗念念币", ir.coins_spent], ["近 7 日消耗念念币", ir.coins_spent_week], ["已兑换套餐数", ir.packages_purchased],
      ].map(insightRow).join("");

      const dash = state.dashboard || {};

        " · 已付费 " + (funnel.paying || 0) + "</span>");
      $("trendChart").innerHTML = lineChart(trend, [
        { key: "new_users", label: "新增用户", color: "#7c5cff" },

        { key: "turns", label: "对话轮次", color: "#28c46c" },

      renderAlerts();

      const recovery = state.recovery || [];

      $("recoveryHead").innerHTML = headIcon("user", "找回密码申请", '<span class="spacer"></span><span class="tag plain">' + recovery.length + " 条待处理</span>");
      $("recoveryList").innerHTML = recovery.length

            <div class="feed-item">

                <div class="feed-title">${escapeHtml(item.username || "未知用户")}${item.contact ? " · " + escapeHtml(item.contact) : ""}</div>
                <div class="feed-sub">${escapeHtml(item.note || "申请重置密码")}${item.user_status === "deleted" ? " · 账号已注销" : ""}</div>
                <div class="feed-time">${fmtTime(item.created_at)}</div>
              </div>
              ${item.user_id && item.user_status !== "deleted"
                ? `<button class="btn small ghost" data-pass="${escapeHtml(String(item.user_id))}" data-name="${escapeHtml(item.username || "")}">重置密码</button>` : ""}
              <button class="btn small" data-recovery-done="${escapeHtml(String(item.id))}">已处理</button>
            </div>`).join("")}</div>`
        : "";

      const tokens = ((summary.token_usage || {}).platform || {});
      const tokenTotal = Number(tokens.total_tokens || 0);
      const tokenCost = Number(tokens.cost_yuan || 0);
      $("usageHead").innerHTML = headIcon("spark", "平台模型用量",
        '<span class="hint">今日 ' + tokenTotal.toLocaleString() + ' tokens · 估算 ¥' + tokenCost.toFixed(2) +
        " · 缓存命中 " + Number(tokens.cached_tokens || 0).toLocaleString() + "</span>");
      const usage = ((summary.platform_usage || {}).by_user || []);
      const names = new Map(state.users.map((item) => [item.id, item.username]));
      const usageItems = usage
        .slice()
        .sort((a, b) => (b.n || 0) - (a.n || 0))
        .slice(0, 8)
        .map((item) => ({ label: names.get(item.user_id) || "用户 #" + item.user_id, value: item.n || 0 }));
      $("usageChart").innerHTML = hbarList(usageItems, { empty: "今日暂无平台模型调用", emptyIcon: "spark" });

      $("outboxHead").innerHTML = headIcon("send", "出站队列", '<span class="spacer"></span><span class="tag plain">' + (pending + sent + failed) + " 条</span>");
      $("outboxChart").innerHTML = donutChart([
        { label: "待发送", value: pending, color: "#7c5cff" },
        { label: "已发送", value: sent, color: "#28c46c" },
        { label: "失败", value: failed, color: "#ff453a" },
      ], { centerValue: pending + sent + failed, centerLabel: "总任务" });
      const failures = (summary.outbox && summary.outbox.recent_failures) || [];
      if (failures.length) {
        $("outboxChart").insertAdjacentHTML("beforeend",
          `<div class="feed" style="margin-top:14px">${failures.slice(0, 3).map((item) => `
            <div class="feed-item">
              <div class="feed-dot" style="background:${TONE.red.soft};color:${TONE.red.color}">${icon("warning")}</div>
              <div class="feed-body">
                <div class="feed-title">#${escapeHtml(String(item.id))} · 用户 ${escapeHtml(String(item.user_id))}</div>
                <div class="feed-sub">${escapeHtml(item.last_error || "发送失败")}</div>
                <div class="feed-time">重试 ${escapeHtml(String(item.attempts == null ? 0 : item.attempts))} 次 · ${fmtTime(item.updated_at)}</div>
              </div>
            </div>`).join("")}</div>`);
      }

      $("reportHead").innerHTML = headIcon("warning", "举报处理进度");
      const resolved = Math.max(0, totalReports - openReports);
      $("reportChart").innerHTML = `<div class="gauge-row">
        ${ringGauge(resolved, totalReports || 1, { color: "#28c46c", cap: "已处理", centerLabel: "办结率", centerValue: (totalReports ? Math.round((resolved / totalReports) * 100) : 0) + "%" })}
        ${ringGauge(openReports, totalReports || 1, { color: "#ff9f2e", cap: "待处理", centerLabel: "待办占比", centerValue: (totalReports ? Math.round((openReports / totalReports) * 100) : 0) + "%" })}
      </div>`;

      $("recentHead").innerHTML = headIcon("clock", "最近操作", '<span class="spacer"></span><button class="btn small ghost" data-tab="audit">全部</button>');
      renderRecentAudit();
    }

    const ALERT_KIND_LABEL = {
      platform: "平台模型", platform_cap: "额度", llm: "模型调用", persona: "人格数据",
      send_failed: "出站发送", crisis: "情感安全", report: "用户举报", recovery: "找回密码",
    };

    function renderAlerts() {
      const items = state.alertItems || [];
      const kindOptions = Object.keys(ALERT_KIND_LABEL)
        .map((key) => `<option value="${key}"${state.alertKind === key ? " selected" : ""}>${ALERT_KIND_LABEL[key]}</option>`)
        .join("");
      $("alertHead").innerHTML = headIcon("warning", "运营告警",
        '<span class="spacer"></span>' +
        '<select class="select small" id="alertKindFilter"><option value="">全部类型</option>' + kindOptions + "</select>" +
        '<select class="select small" id="alertStatusFilter">' +
        `<option value="unread"${state.alertStatus === "unread" ? " selected" : ""}>未读</option>` +
        `<option value="read"${state.alertStatus === "read" ? " selected" : ""}>已读</option>` +
        `<option value=""${state.alertStatus === "" ? " selected" : ""}>全部</option></select>` +
        (items.some((item) => !item.read_at)
          ? '<button class="btn small ghost" id="alertRead">全部已读</button>' : ""));
      $("alertList").innerHTML = items.length
        ? `<div class="feed">${items.map((item) => {
            const jump = alertTarget(item.target);
            return `<div class="feed-item">
              <div class="feed-dot" style="background:${TONE.orange.soft};color:${TONE.orange.color}">${icon("warning")}</div>
              <div class="feed-body">
                <div class="feed-title">${escapeHtml(ALERT_KIND_LABEL[item.kind] || item.kind || "提醒")}${item.read_at ? "" : '<span class="tag plain" style="margin-left:6px">未读</span>'}</div>
                <div class="feed-sub">${escapeHtml(item.message || "")}</div>
                <div class="feed-time">${fmtTime(item.created_at)}${jump ? " · 关联 " + escapeHtml(jump.label) : ""}</div>
              </div>
              ${jump ? `<button class="btn small ghost" data-alert-jump="${escapeHtml(item.target)}">查看</button>` : ""}
              ${item.read_at ? "" : `<button class="btn small ghost" data-alert-read="${item.id}">已读</button>`}
            </div>`;
          }).join("")}</div>`
        : emptyState(state.alertStatus === "unread" ? "暂无未读告警" : "暂无告警", "warning");
      const kindFilter = $("alertKindFilter");
      if (kindFilter) kindFilter.onchange = () => { state.alertKind = kindFilter.value; loadAlerts(); };
      const statusFilter = $("alertStatusFilter");
      if (statusFilter) statusFilter.onchange = () => { state.alertStatus = statusFilter.value; loadAlerts(); };
      const alertRead = $("alertRead");
      if (alertRead) alertRead.onclick = async () => {
        try { await api("/api/admin/alerts/read", { method: "POST" }); toast("已标记为已读"); loadAlerts(); }
        catch (error) { toast(error.message); }
      };
    }

    function alertTarget(target) {
      const value = String(target || "");
      if (value.startsWith("user:")) return { tab: "users", label: "用户 #" + value.slice(5) };
      if (value.startsWith("report:")) return { tab: "reports", label: "举报 #" + value.slice(7) };
      return null;
    }

    function alertQuery() {
      let query = "";
      if (state.alertKind) query += "&kind=" + encodeURIComponent(state.alertKind);
      if (state.alertStatus) query += "&status=" + encodeURIComponent(state.alertStatus);
      return query;
    }

    async function loadAlerts() {
      const query = new URLSearchParams({ limit: "60" });
      if (state.alertKind) query.set("kind", state.alertKind);
      if (state.alertStatus) query.set("status", state.alertStatus);
      try {
        const data = await api("/api/admin/alerts?" + query.toString());
        state.alertItems = data.items || [];
        renderAlerts();
      } catch (error) { toast(error.message); }
    }

    function renderRecentAudit() {
      const items = state.audit.slice(0, 5);
      $("recentAudit").innerHTML = items.length ? `<div class="feed">${items.map(auditItem).join("")}</div>`
        : emptyState("暂无操作记录", "clock");

    function auditItem(item) {

      return `<div class="feed-item">
        <div class="feed-dot">${icon(ACTION_ICON[item.action] || "spark")}</div>
        <div class="feed-body">
          <div class="feed-title">${escapeHtml(ACTION_LABEL[item.action] || item.action || "操作")}</div>
          <div class="feed-sub">${escapeHtml(item.actor || "cli")} → ${escapeHtml(item.target || "-")}${item.detail ? " · " + escapeHtml(item.detail) : ""}</div>

    function openCount() { return state.reports.filter((item) => item.status === "open").length; }
    function renderReports() {

        <div class="report-card">

            <div class="top">
              <b>#${escapeHtml(String(item.id))} · ${escapeHtml(CATEGORY[item.category] || item.category || "其他")}</b>

          </div></td>
        </tr>`;
      }).join("");
    }

    /* ------------------------------------------------------------- orders */
    function renderOrders() {
      const rev = state.ordersRevenue || {};
      $("orderKpis").innerHTML = [
        { icon: "store", label: "累计订单", value: rev.orders || 0, tone: "v" },
        { icon: "gift", label: "累计营收（念念币）", value: rev.coins || 0, tone: "pink" },
        { icon: "send", label: "今日订单", value: rev.today_orders || 0, tone: "blue" },

      ].map(kpiCard).join("");

      $("orderTrendHead").innerHTML = headIcon("spark", "近 30 日营收趋势");
      $("orderTrend").innerHTML = lineChart(

      const query = state.orderQuery.trim().toLowerCase();

      $("orderCount").textContent = "共 " + state.orders.length + " 单";
      if (!items.length) {
        $("orderList").innerHTML = `<tr><td colspan="6">${emptyState("暂无订单", "store")}</td></tr>`;

      $("orderList").innerHTML = items.map((item) => {
        const totalCredits = (Number(item.credits) || 0) + (Number(item.bonus_credits) || 0);

        return `<tr>
          <td data-label="订单" class="num">#${escapeHtml(String(item.id))}</td>
          <td data-label="用户"><b>${escapeHtml(item.username || ("用户 #" + item.user_id))}</b></td>
          <td data-label="套餐">${escapeHtml(item.package_name || "-")}</td>

          <td data-label="时间" class="t3">${fmtShort(item.created_at)}</td>

      }).join("");

    async function openUserDetail(userId) {
      try {
        const [data, sessionData] = await Promise.all([
          api("/api/admin/users/" + encodeURIComponent(userId)),
          api("/api/admin/users/" + encodeURIComponent(userId) + "/sessions").catch(() => ({ items: [] })),
        ]);
        const user = data.user || {};
        const sessions = sessionData.items || [];
        const ledger = (user.ledger || []).length
          ? `<div class="feed">${user.ledger.map((item) => `
              <div class="feed-item">
                <div class="feed-dot">${icon(item.delta >= 0 ? "gift" : "store")}</div>
                <div class="feed-body">
                  <div class="feed-title">${item.delta >= 0 ? "+" : ""}${escapeHtml(String(item.delta))} · 余额 ${escapeHtml(String(item.balance_after))}</div>
                  <div class="feed-sub">${escapeHtml(item.reason || "积分变动")}${item.actor ? " · " + escapeHtml(item.actor) : ""}</div>
                  <div class="feed-time">${fmtTime(item.created_at)}</div>
                </div>
              </div>`).join("")}</div>`
          : emptyState("暂无积分流水", "clock");
        const infoRow = (label, value) =>
          `<div class="insight-row"><span>${escapeHtml(label)}</span><b>${escapeHtml(String(value == null ? "-" : value))}</b></div>`;
        openModal("用户详情 · " + (user.username || ("#" + userId)), `
          <div class="acard">
            ${[
              ["用户 ID", "#" + user.id], ["用户名", user.username || "未命名"],
              ["昵称", user.nickname || "-"], ["状态", user.status === "disabled" ? "已停用" : "正常"],
              ["注册时间", fmtTime(user.created_at)], ["最近活跃", user.last_active_at ? fmtTime(user.last_active_at) : "暂无"],
              ["积分余额", user.credits || 0], ["念念币", user.coins || 0],
              ["人格数", user.personas || 0], ["对话轮次", user.turns || 0],
              ["记忆数", user.memories || 0], ["朋友圈", user.moments || 0], ["订单数", user.orders || 0],
              ["双因素", user.totp_enabled ? "已开启" : "未开启"],
            ].map((row) => infoRow(row[0], row[1])).join("")}
          </div>
          <div class="field full" style="margin-top:12px"><label>管理员备注</label>
            <input id="unNote" value="${escapeHtml(user.note || "")}" placeholder="仅管理员可见" /></div>
          <div class="field full"><label>标签（逗号分隔）</label>
            <input id="unTags" value="${escapeHtml(user.tags || "")}" placeholder="例如 VIP,风险" /></div>
          <div class="btnrow"><button class="btn primary wide" id="unSave">保存备注</button></div>
          <h4 style="margin:16px 0 8px">登录会话</h4>
          <div id="unSessionBox"></div>
          <div class="btnrow">
            <button class="btn ghost" id="unRevokeAll">全部下线</button>
            <button class="btn ghost" id="unResetTotp">重置双因素</button>
          </div>
          <h4 style="margin:16px 0 8px">最近积分流水</h4>${ledger}
        `, (body, mask) => {
          const sessionBox = body.querySelector("#unSessionBox");
          const renderSessions = (items) => {
            sessionBox.innerHTML = items.length
              ? `<div class="feed">${items.map((item) => `
                  <div class="feed-item">
                    <div class="feed-dot">${icon("key")}</div>
                    <div class="feed-body">
                      <div class="feed-title">${escapeHtml(item.ip || "未知 IP")}${item.pending_totp ? ' <span class="tag plain">待双因素</span>' : ""}</div>
                      <div class="feed-sub">${escapeHtml(item.user_agent || "未知设备")}</div>
                      <div class="feed-time">登录 ${fmtTime(item.created_at)} · 到期 ${fmtTime(item.expires_at)} · ${escapeHtml(item.token_prefix)}…</div>
                    </div>
                    <button class="btn small ghost" data-session-revoke="${escapeHtml(item.token_prefix)}">下线</button>
                  </div>`).join("")}</div>`
              : emptyState("暂无有效会话", "key");
          };
          renderSessions(sessions);
          sessionBox.addEventListener("click", async (event) => {
            const button = event.target.closest("[data-session-revoke]");
            if (!button) return;
            button.disabled = true;
            try {
              await api(`/api/admin/users/${encodeURIComponent(userId)}/sessions/${encodeURIComponent(button.dataset.sessionRevoke)}/revoke`, { method: "POST" });
              toast("会话已下线");
              const refreshed = await api(`/api/admin/users/${encodeURIComponent(userId)}/sessions`);
              renderSessions(refreshed.items || []);
            } catch (error) { toast(error.message); button.disabled = false; }
          });
          body.querySelector("#unRevokeAll").onclick = async () => {
            if (!window.confirm("确认下线该用户的全部登录会话？")) return;
            try {
              await api(`/api/admin/users/${encodeURIComponent(userId)}/sessions/revoke-all`, { method: "POST" });
              toast("已全部下线"); renderSessions([]);
            } catch (error) { toast(error.message); }
          };
          body.querySelector("#unResetTotp").onclick = async () => {
            if (!window.confirm("确认重置该用户的双因素绑定？重置后需重新绑定。")) return;
            try {
              await api(`/api/admin/users/${encodeURIComponent(userId)}/totp/reset`, { method: "POST" });
              toast("双因素已重置");
            } catch (error) { toast(error.message); }
          };
          body.querySelector("#unSave").onclick = async () => {
            const note = body.querySelector("#unNote").value;
            const tags = body.querySelector("#unTags").value;
            try {
              await api("/api/admin/users/" + encodeURIComponent(userId) + "/note", {
                method: "POST", body: JSON.stringify({ note, tags }),
              });
              closeModal(mask); toast("备注已保存"); await loadAll();
            } catch (error) { toast(error.message); }
          };
        });
      } catch (error) {
        toast(error.message);
      }
    }

    /* ------------------------------------------------------------ content */
    const PERSONA_STATUS = { ready: "可用", empty: "未创建", ingested: "已导入", retired: "已告别", disabled: "已停用", distilling: "蒸馏中" };

    function renderContent() {
      const query = state.contentQuery.trim().toLowerCase();
      if (state.contentKind === "personas") {
        $("contentHead").innerHTML = "<tr><th>人格</th><th>所属用户</th><th>状态</th><th>对话</th><th>记忆</th><th>朋友圈</th><th style='text-align:right'>操作</th></tr>";
        const items = state.personas.filter((item) =>
          !query || [(item.name), (item.target_name), (item.username)].some((value) => String(value || "").toLowerCase().includes(query)));
        $("contentCount").textContent = "共 " + state.personas.length + " 个人格";
        if (!items.length) { $("contentList").innerHTML = `<tr><td colspan="7">${emptyState("没有匹配的人格", "brain")}</td></tr>`; return; }
        $("contentList").innerHTML = items.map((item) => {
          const disabled = item.status === "disabled";
          return `<tr>
            <td data-label="人格"><b>${escapeHtml(item.name || "未命名")}</b><span class="tag plain">#${escapeHtml(String(item.id))}</span></td>
            <td data-label="用户">${escapeHtml(item.username || ("用户 #" + item.user_id))}</td>
            <td data-label="状态"><span class="tag ${disabled ? "open" : "resolved"}">${escapeHtml(PERSONA_STATUS[item.status] || item.status || "-")}</span></td>
            <td data-label="对话" class="num">${escapeHtml(String(item.turn_count || 0))}</td>
            <td data-label="记忆" class="num">${escapeHtml(String(item.memory_count || 0))}</td>
            <td data-label="朋友圈" class="num">${escapeHtml(String(item.moment_count || 0))}</td>
            <td data-label="操作" style="text-align:right">
              <button class="btn small ${disabled ? "primary" : "ghost"}" data-persona-status="${escapeHtml(String(item.id))}" data-current="${escapeHtml(item.status || "")}">${disabled ? "恢复" : "停用"}</button>
            </td>
          </tr>`;
        }).join("");
        return;
      }
      $("contentHead").innerHTML = "<tr><th>内容</th><th>所属用户</th><th>人格</th><th>互动</th><th>时间</th><th style='text-align:right'>操作</th></tr>";
      const moments = state.moments.filter((item) =>
        !query || [(item.content), (item.username), (item.persona_name)].some((value) => String(value || "").toLowerCase().includes(query)));
      const hiddenCount = state.moments.filter((item) => item.hidden).length;
      $("contentCount").textContent = "共 " + state.moments.length + " 条 · 已隐藏 " + hiddenCount;
      if (!moments.length) { $("contentList").innerHTML = `<tr><td colspan="6">${emptyState("没有匹配的内容", "moments")}</td></tr>`; return; }
      $("contentList").innerHTML = moments.map((item) => `
        <tr${item.hidden ? ' style="opacity:.62"' : ""}>
          <td data-label="内容" class="t3" style="max-width:360px">${escapeHtml((item.content || "").slice(0, 140))}${(item.content || "").length > 140 ? "…" : ""}${item.hidden ? ' <span class="tag open">已隐藏</span>' : ""}</td>
          <td data-label="用户">${escapeHtml(item.username || ("用户 #" + item.user_id))}</td>
          <td data-label="人格">${escapeHtml(item.persona_name || "-")}</td>
          <td data-label="互动" class="num">${escapeHtml(String(item.like_count || 0))} / ${escapeHtml(String(item.comment_count || 0))}</td>
          <td data-label="时间" class="t3">${fmtShort(item.created_at)}</td>
          <td data-label="操作" style="text-align:right">
            <button class="btn small ${item.hidden ? "primary" : "ghost"}" data-moment-hide="${escapeHtml(String(item.id))}" data-current="${item.hidden ? 1 : 0}">${item.hidden ? "恢复" : "隐藏"}</button>
          </td>
        </tr>`).join("");
    }

    /* ---------------------------------------------------------------- ops */
    const SEGMENT_OPTIONS = [
      ["all", "全体"],
      ["active", "活跃用户（近30天）"],
      ["paid", "付费用户"],
      ["new", "新用户（近7天）"],
      ["tag", "按标签"],
      ["manual", "指定用户ID"],
    ];
    const SEGMENT_LABELS = Object.fromEntries(SEGMENT_OPTIONS);

    function segmentOptions(selected) {
      return SEGMENT_OPTIONS.map(([value, text]) =>
        `<option value="${value}" ${selected === value ? "selected" : ""}>${text}</option>`).join("");
    }
    function toLocalInput(value) {
      if (!value) return "";
      const date = new Date(value);
      if (isNaN(date)) return String(value).slice(0, 16);
      const p = (n) => String(n).padStart(2, "0");
      return `${date.getFullYear()}-${p(date.getMonth() + 1)}-${p(date.getDate())}T${p(date.getHours())}:${p(date.getMinutes())}`;
    }
    function audienceText(kind, value) {
      const label = SEGMENT_LABELS[kind] || "全体";
      if (kind === "tag" && value) return `${label}：${value}`;
      if (kind === "manual" && value) return `指定 ${value.split(",").filter(Boolean).length} 人`;
      return label;
    }

    function renderOps() {
      renderAnnounceEditor();
      renderNoticeEditor();
      renderAnnounceList();
      renderNoticeTemplates();
      renderNoticeHistory();
    }

    function renderAnnounceEditor() {
      const editing = state.editingAnnouncement;
      const a = editing || {};
      $("announceHead").innerHTML = headIcon("bell", editing ? `编辑公告 #${a.id}` : "发布公告");
      $("announceForm").innerHTML = `
        <div class="form-grid">
          <div class="field full"><label>标题 <span id="anTitleCount" class="muted"></span></label><input id="anTitle" maxlength="120" value="${escapeHtml(a.title || "")}" placeholder="公告标题" /></div>
          <div class="field"><label>类型</label><select id="anKind" class="select">
            ${[["info", "通知"], ["update", "更新"], ["activity", "活动"]].map(([v, t]) => `<option value="${v}" ${(a.kind || "info") === v ? "selected" : ""}>${t}</option>`).join("")}
          </select></div>
          <div class="field"><label>优先级</label><select id="anPriority" class="select">
            ${[["normal", "普通"], ["high", "高"]].map(([v, t]) => `<option value="${v}" ${(a.priority || "normal") === v ? "selected" : ""}>${t}</option>`).join("")}
          </select></div>
          <div class="field"><label>受众</label><select id="anAudience" class="select">${segmentOptions(a.audience || "all")}</select></div>
          <div class="field"><label>受众参数</label><input id="anAudienceValue" value="${escapeHtml(a.audience_value || "")}" placeholder="标签名或 5,12" /></div>
          <div class="field"><label>置顶</label><label class="switch-line"><input type="checkbox" id="anPinned" ${a.pinned ? "checked" : ""}/> 置顶展示</label></div>
          <div class="field"><label>开始时间</label><input type="datetime-local" id="anStart" value="${toLocalInput(a.starts_at)}" /></div>
          <div class="field"><label>结束时间</label><input type="datetime-local" id="anEnd" value="${toLocalInput(a.ends_at)}" /></div>
          <div class="field full"><label>摘要</label><input id="anSummary" maxlength="200" value="${escapeHtml(a.summary || "")}" placeholder="列表摘要（可选）" /></div>
          <div class="field"><label>跳转链接</label><input id="anLinkUrl" maxlength="500" value="${escapeHtml(a.link_url || "")}" placeholder="https://" /></div>
          <div class="field"><label>链接文案</label><input id="anLinkText" maxlength="40" value="${escapeHtml(a.link_text || "")}" placeholder="查看详情" /></div>
          <div class="field full"><label>正文 <span id="anBodyCount" class="muted"></span></label><textarea id="anBody" rows="4" maxlength="4000" placeholder="公告正文">${escapeHtml(a.body || "")}</textarea></div>
        </div>
        <div class="preview-card" id="anPreview"></div>
        <div class="btnrow">
          ${editing ? '<button class="btn ghost" id="anCancel">取消编辑</button>' : ""}
          <button class="btn" id="announceDraft">存为草稿</button>
          <button class="btn primary" id="announceCreate">${editing ? "保存发布" : "发布公告"}</button>
        </div>`;

      const updatePreview = () => {
        const title = $("anTitle").value.trim() || "公告标题";
        const body = $("anBody").value.trim() || "公告正文将在这里预览";
        const summary = $("anSummary").value.trim();
        const link = $("anLinkText").value.trim() || $("anLinkUrl").value.trim();
        const pinned = $("anPinned").checked;
        const kindLabel = { info: "通知", update: "更新", activity: "活动" }[$("anKind").value] || "通知";
        $("anPreview").innerHTML = `
          <div class="preview-label">用户端预览</div>
          <div class="preview-card-inner">
            <div class="preview-title">${pinned ? '<span class="tag resolved">置顶</span> ' : ""}${escapeHtml(title)}</div>
            <div class="preview-meta">${escapeHtml(kindLabel)} · ${escapeHtml($("anAudience").value === "all" ? "全体" : SEGMENT_LABELS[$("anAudience").value] || "全体")}</div>
            <div class="preview-body">${escapeHtml((summary ? summary + "\n" : "") + body)}</div>
            ${link ? `<div class="preview-link">${escapeHtml(link)}</div>` : ""}
          </div>`;
        $("anTitleCount").textContent = `${$("anTitle").value.length}/120`;
        $("anBodyCount").textContent = `${$("anBody").value.length}/4000`;
      };
      ["anTitle", "anBody", "anSummary", "anKind", "anPinned", "anAudience", "anLinkText", "anLinkUrl"].forEach((id) => {
        const el = $(id); if (el) el.addEventListener("input", updatePreview);
        if (el) el.addEventListener("change", updatePreview);
      });
      updatePreview();

      const collect = (status) => ({
        title: $("anTitle").value.trim(),
        body: $("anBody").value.trim(),
        summary: $("anSummary").value.trim(),
        kind: $("anKind").value,
        priority: $("anPriority").value,
        pinned: $("anPinned").checked,
        link_url: $("anLinkUrl").value.trim(),
        link_text: $("anLinkText").value.trim(),
        audience: $("anAudience").value,
        audience_value: $("anAudienceValue").value.trim(),
        starts_at: $("anStart").value,
        ends_at: $("anEnd").value,
        status,
      });
      const submit = async (status) => {
        const payload = collect(status);
        if (!payload.title) { toast("请填写公告标题"); return; }
        try {
          if (editing) {
            await api(`/api/admin/announcements/${editing.id}`, { method: "PATCH", body: JSON.stringify(payload) });
            toast("公告已更新");
            state.editingAnnouncement = null;
          } else {
            await api("/api/admin/announcements", { method: "POST", body: JSON.stringify(payload) });
            toast(status === "draft" ? "已存为草稿" : "公告已发布");
          }
          await loadAll();
        } catch (error) { toast(error.message); }
      };
      const btnA = $("announceCreate");
      if (btnA) btnA.onclick = () => submit("published");
      const btnD = $("announceDraft");
      if (btnD) btnD.onclick = () => submit("draft");
      const btnC = $("anCancel");
      if (btnC) btnC.onclick = () => { state.editingAnnouncement = null; renderOps(); };
    }

    function renderNoticeEditor() {
      $("noticeHead").innerHTML = headIcon("send", "站内通知");
      const variables = Object.keys(state.noticeVariables || {});
      $("noticeForm").innerHTML = `
        <div class="form-grid">
          <div class="field"><label>受众</label><select id="ntAudience" class="select">${segmentOptions(state.noticeAudience)}</select></div>
          <div class="field"><label>受众参数</label><input id="ntAudienceValue" placeholder="标签名或 5,12" /></div>
          <div class="field full"><label>模板</label><select id="ntTemplate" class="select"><option value="">不使用模板</option>${state.noticeTemplates.map((t) => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join("")}</select></div>
          <div class="field full"><label>通知内容 <span id="ntCount" class="muted"></span></label><textarea id="ntMessage" rows="4" maxlength="500" placeholder="发送给目标受众"></textarea></div>
          <div class="field full"><label>插入变量</label><div class="var-row">${variables.map((v) => `<button type="button" class="var-btn" data-var="${escapeHtml(v)}">${escapeHtml(v)}</button>`).join("")}</div></div>
          <div class="field full"><label class="switch-line"><input type="checkbox" id="ntRender" ${state.noticeRender ? "checked" : ""}/> 按收件人渲染变量</label></div>
        </div>
        <div class="audience-line" id="ntAudienceHint">尚未预览命中人数</div>
        <div class="btnrow">
          <button class="btn ghost" id="ntCountBtn">预览人数</button>
          <button class="btn primary" id="noticeSend">发送通知</button>
        </div>`;

      const countEl = () => $("ntCount");
      const bind = () => { const el = countEl(); if (el) el.textContent = `${$("ntMessage").value.length}/500`; };
      $("ntMessage").addEventListener("input", bind);
      bind();
      $("ntRender").checked = state.noticeRender;
      $("ntRender").addEventListener("change", () => { state.noticeRender = $("ntRender").checked; });
      $("ntAudience").addEventListener("change", () => {
        state.noticeAudience = $("ntAudience").value;
        $("ntAudienceHint").textContent = "尚未预览命中人数";
        state.audienceCount = null;
      });
      $("ntTemplate").addEventListener("change", () => {
        const id = Number($("ntTemplate").value);
        const found = state.noticeTemplates.find((t) => Number(t.id) === id);
        if (found) { $("ntMessage").value = found.body || ""; bind(); }
      });
      document.querySelectorAll("[data-var]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const field = $("ntMessage");
          const token = btn.dataset.var;
          const start = field.selectionStart == null ? field.value.length : field.selectionStart;
          const end = field.selectionEnd == null ? field.value.length : field.selectionEnd;
          field.value = field.value.slice(0, start) + token + field.value.slice(end);
          field.focus();
          field.selectionStart = field.selectionEnd = start + token.length;
          bind();
        });
      });
      const countBtn = $("ntCountBtn");
      if (countBtn) countBtn.onclick = async () => {
        try {
          const result = await api("/api/admin/audience/count", {
            method: "POST",
            body: JSON.stringify({ audience: $("ntAudience").value, audience_value: $("ntAudienceValue").value.trim() }),
          });
          state.audienceCount = result.count;
          $("ntAudienceHint").textContent = `预计触达 ${result.count} 位用户`;
          if (!result.count) toast("目标受众为空");
        } catch (error) { toast(error.message); }
      };
      const sendBtn = $("noticeSend");
      if (sendBtn) sendBtn.onclick = () => {
        const message = $("ntMessage").value.trim();
        if (!message) { toast("请填写通知内容"); return; }
        const audience = $("ntAudience").value;
        const audienceValue = $("ntAudienceValue").value.trim();
        const label = audienceText(audience, audienceValue);
        const scope = state.audienceCount == null ? label : `${label}（约 ${state.audienceCount} 人）`;
        openModal("发送通知", `<div class="sub">确认向 <b>${escapeHtml(scope)}</b> 发送该通知？</div>`, (body, mask) => {
          const row = document.createElement("div");
          row.className = "btnrow";
          row.innerHTML = '<button class="btn ghost" data-cancel>取消</button><button class="btn primary" data-confirm>确认发送</button>';
          body.appendChild(row);
          row.querySelector("[data-cancel]").onclick = () => closeModal(mask);
          row.querySelector("[data-confirm]").onclick = async () => {
            try {
              const result = await api("/api/admin/notices", {
                method: "POST",
                body: JSON.stringify({
                  message,
                  audience,
                  audience_value: audienceValue,
                  render_variables: $("ntRender").checked,
                }),
              });
              closeModal(mask);
              toast("已发送给 " + (result.sent || 0) + " 位用户");
              $("ntMessage").value = "";
              state.audienceCount = null;
              await loadAll();
            } catch (error) { toast(error.message); }
          };
        });
      };
    }

    function renderAnnounceList() {
      $("announceListHead").innerHTML = headIcon("clock", "公告列表", `<span class="spacer"></span><span class="tag plain">${state.announcements.length} 条</span>`);
      if (!state.announcements.length) { $("announceList").innerHTML = emptyState("暂无公告", "bell"); return; }
      const stateTag = (item) => ({
        draft: '<span class="tag plain">草稿</span>',
        stopped: '<span class="tag plain">已停发</span>',

          <div class="field"><label>豆包应用 ID${platform.doubao_app_id ? "（已配置）" : "（旧版控制台）"}</label><input id="pfDoubaoAppId" value="${escapeHtml(platform.doubao_app_id || "")}" /></div>
          <div class="field"><label>豆包访问令牌${platform.has_doubao_token ? "（已配置 " + escapeHtml(platform.doubao_token_masked || "") + "）" : "（旧版控制台）"}</label>
            <input id="pfDoubaoToken" type="password" autocomplete="off" placeholder="${platform.has_doubao_token ? "留空保持不变" : "填入豆包 Access Token"}" /></div>
          <div class="field"><label>豆包资源标识</label><input id="pfDoubaoResource" value="${escapeHtml(platform.doubao_resource_id || "")}" placeholder="留空自动推断" /></div>
          <div class="field"><label>音色克隆扣积分</label><input id="pfVoiceCloneCost" type="number" min="0" value="${escapeHtml(String(platform.voice_clone_cost == null ? 500 : platform.voice_clone_cost))}" /></div>
          <div class="field"><label>语音回复扣积分</label><input id="pfVoiceReplyCost" type="number" min="0" value="${escapeHtml(String(platform.voice_reply_cost == null ? 20 : platform.voice_reply_cost))}" /></div>
          <div class="field"><label>语音用量</label><input value="克隆 ${escapeHtml(String((platform.voice_usage || {}).clones || 0))} 次 / 回复 ${escapeHtml(String((platform.voice_usage || {}).replies || 0))} 条" disabled /></div>
        </div>
        <div class="toggle-row">
          <div class="tt"><b>启用语音服务</b><span>开启后用户可克隆音色并让分身用语音回复</span></div>
          <label class="switch"><input type="checkbox" id="pfVoiceEnabled" ${platform.voice_enabled ? "checked" : ""} /><span class="track"></span></label>
        </div>
        <div class="toggle-row">
          <div class="tt"><b>启用平台模型</b><span>关闭后未配置 Key 的用户将无法获得回复</span></div>
          <label class="switch"><input type="checkbox" id="pfEnabled" ${platform.enabled ? "checked" : ""} /><span class="track"></span></label>
        </div>
        <div class="form-actions">
          <button class="btn primary" id="pfSave">保存平台配置</button>
          <span class="state-line">${platform.has_key ? icon("check", "ic chip-ok") + '<span class="chip-ok">密钥已就绪</span>' : icon("warning", "ic chip-off") + '<span class="chip-off">尚未配置密钥</span>'}</span>
          <span class="state-line">${voiceChip}</span>
        </div>`;
      $("pfSave").onclick = async () => {
        const button = $("pfSave");
        if (button.disabled) return;
        button.disabled = true;
        try {
          const payload = {
            base_url: $("pfBase").value.trim(), model: $("pfModel").value.trim(),
            enabled: $("pfEnabled").checked,
            per_turn_cost: Number($("pfCost").value) || 0,
            new_user_gift: Number($("pfGift").value) || 0,
            default_credit_days: Number($("pfDefaultDays").value) || 30,
            distill_credit_cost: Number($("pfDistillCost").value) || 0,
            voice_provider: $("pfVoiceProvider").value,
            voice_tts_model: $("pfVoiceModel").value.trim(),
            doubao_app_id: $("pfDoubaoAppId").value.trim(),
            doubao_resource_id: $("pfDoubaoResource").value.trim(),
            voice_clone_cost: Number($("pfVoiceCloneCost").value) || 0,
            voice_reply_cost: Number($("pfVoiceReplyCost").value) || 0,
            voice_enabled: $("pfVoiceEnabled").checked,
          };
          const key = $("pfKey").value.trim();
          if (key) payload.api_key = key;
          const voiceKey = $("pfVoiceKey").value.trim();
          if (voiceKey) payload.minimax_api_key = voiceKey;
          const doubaoKey = $("pfDoubaoKey").value.trim();
          if (doubaoKey) payload.doubao_api_key = doubaoKey;
          const doubaoToken = $("pfDoubaoToken").value.trim();
          if (doubaoToken) payload.doubao_access_token = doubaoToken;
          state.platform = await api("/api/admin/platform", { method: "PUT", body: JSON.stringify(payload) });
          toast("平台配置已保存");
          renderCreditsPanel();
          loadAll();
        } catch (error) { button.disabled = false; toast(error.message); }
      };

      const totals = state.creditTotals || {};
      const held = totals.held || 0, used = totals.used || 0, granted = totals.granted || 0;
      const expired = totals.expired || 0;
      $("creditTotalsHead").innerHTML = headIcon("store", "积分概览");
      $("creditTotals").innerHTML = donutChart([
        { label: "用户持有", value: held, color: "#7c5cff" },
        { label: "累计消耗", value: used, color: "#f06595" },
        { label: "已过期", value: expired, color: "#9aa0ad" },
      ], { centerValue: granted, centerLabel: "累计发放", size: 168 }) +
        `<div class="divider-soft"></div>
        <div class="gauge-row">
          ${ringGauge(used, granted || 1, { color: "#f06595", size: 96, cap: "消耗率", centerValue: (granted ? Math.round((used / granted) * 100) : 0) + "%", centerLabel: "已消耗" })}
          ${ringGauge(held, granted || 1, { color: "#7c5cff", size: 96, cap: "存量率", centerValue: (granted ? Math.round((held / granted) * 100) : 0) + "%", centerLabel: "未使用" })}
        </div>
        <div class="mini" style="margin-top:10px">累计到期清零 ${escapeHtml(String(expired))} 积分</div>`;

      const coinTotals = state.coinsTotals || {};
      const coinHeld = coinTotals.held || 0, coinSpent = coinTotals.spent || 0, coinGranted = coinTotals.granted || 0;
      $("coinHead").innerHTML = headIcon("gift", "念念币概览");
      $("coinOverview").innerHTML = donutChart([
        { label: "用户持有", value: coinHeld, color: "#ff9f2e" },
        { label: "已消耗", value: coinSpent, color: "#f06595" },
      ], { centerValue: coinGranted, centerLabel: "累计发放", size: 168 }) +
        `<div class="divider-soft"></div>
        <div class="gauge-row">
          ${ringGauge(coinSpent, coinGranted || 1, { color: "#f06595", size: 96, cap: "消耗率", centerValue: (coinGranted ? Math.round((coinSpent / coinGranted) * 100) : 0) + "%", centerLabel: "已消耗" })}
          ${ringGauge(coinHeld, coinGranted || 1, { color: "#ff9f2e", size: 96, cap: "存量率", centerValue: (coinGranted ? Math.round((coinHeld / coinGranted) * 100) : 0) + "%", centerLabel: "未使用" })}
        </div>`;

      renderRedemptionPanel();

      $("packageHead").innerHTML = headIcon("download", "积分套餐", '<span class="spacer"></span><button class="btn small" id="addPackage">新增套餐</button>');
      const packs = state.creditPackages || [];
      const TIER_ORDER = [30, 90, 365];
      const TIER_LABELS = { 30: "月度", 90: "季度", 365: "年度" };
      if (!packs.length) {
        $("packageList").innerHTML = emptyState("暂无套餐", "download");
      } else {
        const groups = new Map();
        packs.forEach((item) => {
          const days = Number(item.validity_days) || 0;
          if (!groups.has(days)) groups.set(days, []);
          groups.get(days).push(item);
        });
        const order = [...TIER_ORDER.filter((days) => groups.has(days)),
          ...[...groups.keys()].filter((days) => !TIER_ORDER.includes(days))];
        $("packageList").innerHTML = order.map((days) => {
          const label = TIER_LABELS[days] || (days > 0 ? days + " 天" : "长期");
          const cards = groups.get(days).map((item) => `
        <div class="pkg ${item.active ? "active" : ""}">
          ${item.badge ? `<span class="badge">${escapeHtml(item.badge)}</span>` : ""}
          <div class="field" style="margin-bottom:8px"><label>名称</label><input data-pkg-name="${item.id}" value="${escapeHtml(item.name)}" /></div>
          <div class="pk-credits">${escapeHtml(String(item.credits))} <span style="font-size:13px;font-weight:700;color:var(--text-3)">积分</span></div>
          <div class="form-grid" style="margin-top:10px">
            <div class="field"><label>定价(念念币)</label><input data-pkg-coins="${item.id}" type="number" min="0" value="${escapeHtml(String(item.coins == null ? 0 : item.coins))}" /></div>
            <div class="field"><label>有效期</label><select data-pkg-days="${item.id}">${validityOptions(item.validity_days)}</select></div>
          </div>
          <div class="form-grid" style="margin-top:0">
            <div class="field"><label>积分</label><input data-pkg-credits="${item.id}" type="number" min="1" value="${item.credits}" /></div>
            <div class="field"><label>徽标</label><input data-pkg-badge="${item.id}" value="${escapeHtml(item.badge || "")}" placeholder="可选" /></div>
          </div>
          <div class="form-grid" style="margin-top:0">
            <div class="field full"><label>赠送积分</label><input data-pkg-bonus-credits="${item.id}" type="number" min="0" value="${Number(item.bonus_credits) || 0}" /></div>
          </div>
          <div class="pk-actions">
            <label class="switch" title="启用"><input type="checkbox" data-pkg-active="${item.id}" ${item.active ? "checked" : ""} /><span class="track"></span></label>
            <button class="btn small primary" style="margin-left:auto" data-pkg-save="${item.id}">保存</button>
          </div>
        </div>`).join("");
          return `<div class="pkg-tier"><div class="pkg-tier-head">${escapeHtml(label)}<span>${days > 0 ? days + " 天" : ""}</span></div><div class="pkg-grid">${cards}</div></div>`;
        }).join("");
      }
      $("addPackage").onclick = openAddPackage;
    }

    function renderRedemptionPanel() {
      const stats = state.redemptionStats || {};
      const statusLabel = { unused: "未使用", used: "已使用", void: "已作废" };
      $("codeHead").innerHTML = headIcon("key", "兑换码",
        '<span class="spacer"></span>' +
        '<select class="select small" id="rcFilter">' +
        `<option value=""${state.redemptionFilter === "" ? " selected" : ""}>全部状态</option>` +
        `<option value="unused"${state.redemptionFilter === "unused" ? " selected" : ""}>未使用</option>` +
        `<option value="used"${state.redemptionFilter === "used" ? " selected" : ""}>已使用</option>` +
        `<option value="void"${state.redemptionFilter === "void" ? " selected" : ""}>已作废</option></select>` +
        '<button class="btn small ghost" id="rcExport">导出 CSV</button>' +
        '<button class="btn small ghost" id="rcBatchVoid">批量作废</button>' +
        '<span class="tag plain">未使用 ' + escapeHtml(String(stats.unused || 0)) +
        ' · 已使用 ' + escapeHtml(String(stats.used || 0)) + "</span>");
      $("codeForm").innerHTML = `
        <div class="form-grid">
          <div class="field"><label>生成数量</label><input id="rcCount" type="number" min="1" max="200" value="10" /></div>
          <div class="field"><label>每码念念币</label><input id="rcCoins" type="number" min="1" value="100" /></div>
          <div class="field full"><label>批次备注（可选）</label><input id="rcBatch" placeholder="例如：9 月活动" /></div>
        </div>
        <div class="form-actions">
          <button class="btn primary" id="rcCreate">生成兑换码</button>
          <span class="state-line">兑换码是念念币的唯一发放来源</span>
        </div>`;
      const items = state.redemptionItems || [];
      const selected = new Set(state.redemptionSelected || []);
      const voidable = items.filter((item) => item.status === "unused").map((item) => String(item.id));
      const allChecked = voidable.length > 0 && voidable.every((id) => selected.has(id));
      $("codeList").innerHTML = items.length ? `<div class="divider-soft"></div>
        <div class="tbl-wrap" style="margin-top:6px"><table class="atable compact">
        <thead><tr>
          <th style="width:34px"><input type="checkbox" id="rcSelectAll"${allChecked ? " checked" : ""} /></th>
          <th>兑换码</th><th>念念币</th><th>状态</th><th>兑换用户</th><th>时间</th></tr></thead>
        <tbody>${items.map((item) => `
          <tr>
            <td data-label="选择"><input type="checkbox" data-rc-select="${item.id}"${selected.has(String(item.id)) ? " checked" : ""}${item.status === "unused" ? "" : " disabled"} /></td>
            <td data-label="兑换码"><code class="code-cell" data-copy="${escapeHtml(item.code)}">${escapeHtml(item.code)}</code></td>
            <td data-label="念念币" class="num">${escapeHtml(String(item.coins))}</td>
            <td data-label="状态"><span class="tag ${item.status === "unused" ? "resolved" : "plain"}">${escapeHtml(statusLabel[item.status] || item.status)}</span></td>
            <td data-label="兑换用户" class="t3">${escapeHtml(item.redeemed_username || "-")}</td>
            <td data-label="时间" class="t3">${item.status === "used" ? fmtShort(item.redeemed_at) : fmtShort(item.created_at)}</td>
          </tr>`).join("")}</tbody></table></div>` : "";
      const selectAll = $("rcSelectAll");
      if (selectAll) selectAll.onchange = () => {
        state.redemptionSelected = selectAll.checked ? voidable.slice() : [];
        renderRedemptionPanel();
      };
      $("codeList").querySelectorAll("[data-rc-select]").forEach((node) => {
        node.onchange = () => {
          const id = String(node.dataset.rcSelect);
          const current = new Set(state.redemptionSelected || []);
          if (node.checked) current.add(id); else current.delete(id);
          state.redemptionSelected = Array.from(current);
        };
      });
      const filterSelect = $("rcFilter");
      if (filterSelect) filterSelect.onchange = () => { state.redemptionFilter = filterSelect.value; state.redemptionSelected = []; loadRedemptionCodes(); };
      $("rcExport").onclick = async () => {
        const button = $("rcExport");
        button.disabled = true;
        try {
          const suffix = state.redemptionFilter ? "?status=" + encodeURIComponent(state.redemptionFilter) : "";
          await downloadCsv("/api/admin/redemption-codes/export" + suffix);
        } catch (error) { toast(error.message); } finally { button.disabled = false; }
      };
      $("rcBatchVoid").onclick = () => {
        const ids = state.redemptionSelected || [];
        const scopeText = ids.length
          ? `选中的 ${ids.length} 个兑换码`
          : "当前筛选下全部未使用的兑换码";
        openModal("批量作废", `<div class="sub">确认作废 ${escapeHtml(scopeText)}？已使用或已作废的兑换码会自动跳过。</div>
          <div class="btnrow"><button class="btn primary" id="rcVoidOk" style="flex:1">确认作废</button></div>`, (body, mask) => {
          body.querySelector("#rcVoidOk").onclick = async () => {
            try {
              const result = await api("/api/admin/redemption-codes/batch-void", {
                method: "POST",
                body: JSON.stringify(ids.length
                  ? { ids: ids.map(Number) }
                  : { all_matching: true, status: "unused" }),
              });
              closeModal(mask);
              toast(`已作废 ${result.voided || 0} 个，跳过 ${result.skipped || 0} 个`);
              state.redemptionSelected = [];
              await loadAll();
            } catch (error) { toast(error.message); }
          };
        });
      };
      $("rcCreate").onclick = async () => {
        const button = $("rcCreate");
        if (button.disabled) return;
        const count = Number($("rcCount").value) || 0;
        const coins = Number($("rcCoins").value) || 0;
        if (count <= 0 || coins <= 0) { toast("数量与念念币需大于 0"); return; }
        button.disabled = true;
        try {
          const result = await api("/api/admin/redemption-codes", {
            method: "POST",
            body: JSON.stringify({ count, coins, batch: $("rcBatch").value.trim() }),
          });
          toast("已生成 " + (result.items || []).length + " 个兑换码");
          await loadAll();
          setSection("credits");
        } catch (error) { button.disabled = false; toast(error.message); }
      };
      $("codeList").querySelectorAll("[data-copy]").forEach((node) => {
        node.onclick = async () => {
          try { await navigator.clipboard.writeText(node.dataset.copy); toast("已复制"); }
          catch (error) { toast("复制失败"); }
        };
      });
    }

    async function loadRedemptionCodes() {
      const suffix = state.redemptionFilter ? "?limit=200&status=" + encodeURIComponent(state.redemptionFilter) : "?limit=200";
      try {
        const data = await api("/api/admin/redemption-codes" + suffix);
        state.redemptionItems = data.items || [];
        state.redemptionStats = data.stats || state.redemptionStats;
        renderRedemptionPanel();
      } catch (error) { toast(error.message); }
    }

    async function savePackage(packageId) {
      const name = document.querySelector(`[data-pkg-name="${packageId}"]`).value.trim();
      const credits = Number(document.querySelector(`[data-pkg-credits="${packageId}"]`).value) || 0;
      const coins = Number(document.querySelector(`[data-pkg-coins="${packageId}"]`).value) || 0;
      const badge = document.querySelector(`[data-pkg-badge="${packageId}"]`).value.trim();
      const active = document.querySelector(`[data-pkg-active="${packageId}"]`).checked;
      const validity_days = Number(document.querySelector(`[data-pkg-days="${packageId}"]`).value) || 30;
      const bonus_credits = Number(document.querySelector(`[data-pkg-bonus-credits="${packageId}"]`).value) || 0;
      try {
        await api("/api/admin/packages", { method: "POST", body: JSON.stringify({ id: packageId, name, credits, coins, badge, sort: packageId, active, validity_days, bonus_credits }) });
        toast("套餐已保存");
        await loadAll();
      } catch (error) { toast(error.message); }
    }

    function openAddPackage() {
      openModal("新增套餐", `
        <div class="field"><label>名称</label><input id="npkgName" placeholder="例如：豪华包" /></div>
        <div class="split">
          <div class="field"><label>积分</label><input id="npkgCredits" type="number" min="1" value="2000" /></div>
          <div class="field"><label>定价(念念币)</label><input id="npkgCoins" type="number" min="0" value="180" /></div>
        </div>
        <div class="field"><label>有效期</label><select id="npkgDays">${validityOptions(90)}</select></div>
        <div class="field"><label>赠送积分</label><input id="npkgBonusCredits" type="number" min="0" value="0" /></div>
        <div class="field"><label>徽标</label><input id="npkgBadge" placeholder="可选" /></div>
        <div class="btnrow"><button class="btn primary" id="npkgOk" style="flex:1">创建</button></div>`, (body, mask) => {
        body.querySelector("#npkgOk").onclick = async () => {
          try {
            await api("/api/admin/packages", {
              method: "POST",
              body: JSON.stringify({
                name: body.querySelector("#npkgName").value.trim(),
                credits: Number(body.querySelector("#npkgCredits").value) || 0,
                coins: Number(body.querySelector("#npkgCoins").value) || 0,
                badge: body.querySelector("#npkgBadge").value.trim(),
                validity_days: Number(body.querySelector("#npkgDays").value) || 30,
                bonus_credits: Number(body.querySelector("#npkgBonusCredits").value) || 0,
                sort: 99, active: true,
              }),
            });
            closeModal(mask); toast("套餐已创建"); await loadAll();
          } catch (error) { toast(error.message); }
        };
      });
    }

    /* ------------------------------------------------------------- system */
    function renderSystem() {
      const metrics = state.metrics || {};
      const health = state.health || {};
      const outbox = (metrics.outbox && metrics.outbox.counts) || {};
      const ok = health.status === "ok";
      const failed = outbox.failed || 0;
      $("healthGrid").innerHTML = [
        { icon: "watch", label: "服务状态", value: ok ? "运行中" : "异常", tone: ok ? "green" : "red", display: ok ? "运行中" : "异常" },
        { icon: "clock", label: "运行时长", value: fmtUptime(metrics.uptime_seconds), tone: "v", display: fmtUptime(metrics.uptime_seconds) },
        { icon: "user", label: "平台用户", value: health.users || 0, tone: "blue" },
        { icon: "bell", label: "出站失败", value: failed, tone: failed ? "red" : "green" },
      ].map((item) => {
        const tone = TONE[item.tone] || TONE.v;
        const text = item.display != null ? item.display : item.value;
        return `<div class="acard" style="display:flex;align-items:center;gap:14px;padding:18px 20px">
          <div class="kpi" style="padding:0;border:0;box-shadow:none;background:transparent">
            <div class="tile" style="--tone:${tone.color};--tone-soft:${tone.soft}">${icon(item.icon)}</div>
          </div>
          <div><div style="font-size:22px;font-weight:800;letter-spacing:-0.03em">${escapeHtml(String(text))}</div>
            <div class="mini" style="margin-top:3px">${escapeHtml(item.label)}</div></div>
        </div>`;
      }).join("");

      $("counterHead").innerHTML = headIcon("sliders", "事件计数器");
      const counters = Object.entries(metrics.counters || {}).sort((a, b) => b[1] - a[1]).slice(0, 10);
      $("counterList").innerHTML = hbarList(
        counters.map(([key, value]) => ({ label: key, value, tone: /error|fail|insufficient|blocked/i.test(key) ? "err" : "" })),
        { empty: "暂无计数", emptyIcon: "sliders" });

      $("timingHead").innerHTML = headIcon("clock", "耗时统计", '<span class="hint">毫秒</span>');
      const timings = Object.entries(metrics.timings || {});
      $("timingList").innerHTML = timings.length ? `<div class="feed">${timings.map(([key, value]) => `
        <div class="feed-item">
          <div class="feed-dot">${icon("clock")}</div>
          <div class="feed-body">
            <div class="feed-title">${escapeHtml(key)}</div>
            <div class="feed-sub">平均 ${escapeHtml(String(value.avg_ms))} ms · 峰值 ${escapeHtml(String(value.max_ms))} ms</div>
            <div class="feed-time">${value.count != null ? "调用 " + escapeHtml(String(value.count)) + " 次" : ""}</div>
          </div>
        </div>`).join("")}</div>` : emptyState("暂无数据", "clock");
    }

    /* --------------------------------------------------------------- load */
    async function loadAll(force) {
      if (state.loading) { state.pendingReload = true; return; }
      state.loading = true;
      state.pendingReload = false;
      $("refreshBtn").disabled = true;
      try {
        const [summary, users, reports, audit, metrics, health, platform, credits, codes, recovery, orders, dashboard,
          personas, moments, announcements, admins, flags, bindings, backups, tasks, locked, alertsData,
          templates, noticesHistory] = await Promise.all([
          api("/api/admin/summary"), api("/api/admin/users?size=100"), api("/api/admin/reports"),
          api("/api/admin/audit"), api("/api/metrics"), api("/health"),
          api("/api/admin/platform"), api("/api/admin/credits"),
          api("/api/admin/redemption-codes?limit=200"), api("/api/admin/recovery"),
          api("/api/admin/orders?limit=200"), api("/api/admin/dashboard?days=30" + (force ? "&refresh=1" : "")),
          api("/api/admin/content/personas?limit=200"), api("/api/admin/content/moments?limit=200"),
          api("/api/admin/announcements"), api("/api/admin/admins"),

    async function downloadCsv(path) {
      const response = await fetch(path, { credentials: "same-origin" });
      if (response.status === 401) { window.location.href = "/admin/login"; return; }
      if (!response.ok) { toast("导出失败（" + response.status + "）"); return; }
      const blob = await response.blob();
      const disposition = response.headers.get("content-disposition") || "";
      const matched = disposition.match(/filename="?([^";]+)"?/);
      const name = matched ? matched[1] : "export.csv";
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = name;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      toast("已导出 " + name);
    }

          if (password.length < 10) { toast("密码至少 10 位，且需含大小写字母、数字与符号"); return; }
          try {
            await api("/api/admin/admins", { method: "POST", body: JSON.stringify({ username, password, name: body.querySelector("#adLabel").value.trim() }) });
            closeModal(mask); toast("管理员已创建"); await loadAll();
          } catch (error) { toast(error.message); }
        };
      });
    };
    $("navToggle").onclick = openNav;
    $("sideClose").onclick = closeNav;
    $("navScrim").onclick = closeNav;
    $("refreshBtn").onclick = () => loadAll(true);
    $("logoutBtn").onclick = async () => {
      try { await api("/api/admin/auth/logout", { method: "POST" }); } catch (error) { /* 忽略 */ }
      window.location.href = "/admin/login";
    };

    window.addEventListener("hashchange", () => setSection(segmentOf()));
    document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeNav(); });
    setInterval(() => { if (!document.hidden && !state.loading) loadAll(); }, 60000);

    (async () => {
      mountNav();
      setSection(segmentOf());
      initSegments();
      try {
        const data = await api("/api/admin/me");
        window.__admin = data.admin;
        $("sideName").textContent = data.admin.name || data.admin.username || "管理员";
        $("sideAvatar").textContent = (data.admin.username || "A").slice(0, 1).toUpperCase();
      } catch (error) { window.location.href = "/admin/login"; return; }
      await loadAll();
    })();
  </script>
</body>
</html>
