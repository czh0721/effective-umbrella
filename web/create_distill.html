<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#eceef5" />
  <title>创建分身 — 念念</title>
  <link rel="stylesheet" href="/static/app.css" />
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg" />
  <link rel="apple-touch-icon" href="/static/icon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
</head>
<body>
  <div class="topbar">
    <a class="icon-btn" href="/app" aria-label="返回">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <b style="font-size:14px">创建分身</b>
    <div class="spacer"></div>
  </div>

  <div class="shell stagger">
    <h2 style="font-size:21px;font-weight:800;margin-bottom:4px">选择创建方式</h2>
    <p class="muted block">三种方式，都能得到一个会聊天的分身</p>

    <div class="seg block" id="createSeg">
      <div class="on" data-tab="distill">AI 蒸馏</div>
      <div data-tab="blank">手动编写</div>
      <div data-tab="market">角色市场</div>
    </div>

    <div id="panelDistill">
      <section class="glass card">
        <div class="upload">
          <div class="uc"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
          <label class="drop" id="dDrop" for="dFile" style="border:none;background:transparent;padding:0">
            <b style="font-size:14.5px">拖入或点击上传聊天记录</b>
            <p class="mini" style="margin:5px 0 10px">支持 .txt / .json / .jsonl，单文件 ≤ 50MB，最多 20 个</p>
            <input id="dFile" type="file" multiple hidden accept=".txt,.json,.jsonl" />
          </label>
          <div class="chip-list" style="justify-content:center">
            <span class="tag-chip">微信导出</span>
            <span class="tag-chip">QQ</span>
            <span class="tag-chip">短信</span>
            <span class="tag-chip">iMessage</span>
          </div>
        </div>
        <div class="filelist mini" id="dList" style="margin-top:12px;text-align:center">系统会自动检测内容格式，无需手动选择。</div>
      </section>

      <section class="glass card">
        <div class="field"><label>名字 *</label><input id="dName" placeholder="例如：小鹿" /></div>
        <div class="field" style="margin-bottom:0"><label>要复刻的对象昵称（可选）</label><input id="dTarget" placeholder="聊天里 ta 的昵称，留空自动推断" /></div>
      </section>

      <section class="glass card" id="dProgressCard" style="display:none">
        <div class="row" style="margin-bottom:6px"><b class="flex1" style="font-size:13.5px">蒸馏人格卡片</b><span class="mini" id="dPercent">0%</span></div>
        <div id="dProgress"></div>
      </section>

      <div class="mini" id="dTicketHint" style="text-align:center;margin:2px 0 10px">正在读取蒸馏积分…</div>
      <button class="btn primary wide" id="dSubmit">开始蒸馏</button>
    </div>

    <div id="panelBlank" style="display:none">
      <section class="glass card">
        <div class="field" style="margin-bottom:0"><label>名字 *</label><input id="bName" placeholder="例如：小鹿" /></div>
        <p class="mini" style="margin-top:10px">先取个名字，创建后进入工作台继续完善人设。</p>
      </section>
      <button class="btn primary wide" id="bSubmit">创建并进入</button>
    </div>

    <div id="panelMarket" style="display:none">
      <div id="mList"></div>
    </div>

    <div class="slogan">念念 · 想 ta 的时候，念念就好</div>
  </div>
  <div class="toasts"></div>
  <script src="/static/app.js"></script>
  <script>
    const MAX_BYTES = 50 * 1024 * 1024;
    const MAX_FILES = 20;
    const ALLOWED = [".txt", ".json", ".jsonl"];
    let files = [];

    // 幂等键：同样的名字/对象/文件算同一次蒸馏，重试或刷新不会重复建人格；
    // 一旦改动输入，签名变化即视为新的一次蒸馏。
    const ATTEMPT_KEY = "distillAttempt";
    let clientId = "";
    let clientSig = "";
    try {
      const saved = JSON.parse(sessionStorage.getItem(ATTEMPT_KEY) || "null");
      if (saved && saved.id) { clientId = saved.id; clientSig = saved.sig || ""; }
    } catch (error) { /* ignore */ }

    function newClientId() {
      try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g, ""); } catch (error) { /* ignore */ }
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    }
    function attemptSignature() {
      const parts = [$("dName").value.trim(), $("dTarget").value.trim()];
      files.forEach((file) => parts.push(file.name + ":" + file.size));
      return parts.join("|");
    }
    function ensureClientId() {
      const sig = attemptSignature();
      if (!clientId || sig !== clientSig) {
        clientId = newClientId();
        clientSig = sig;
        try { sessionStorage.setItem(ATTEMPT_KEY, JSON.stringify({ id: clientId, sig })); } catch (error) { /* ignore */ }
      }
      return clientId;
    }

    function showTab(tab) {
      document.querySelectorAll("#createSeg > div").forEach((el) => {
        el.classList.toggle("on", el.dataset.tab === tab);
      });
      $("panelDistill").style.display = tab === "distill" ? "" : "none";
      $("panelBlank").style.display = tab === "blank" ? "" : "none";
      $("panelMarket").style.display = tab === "market" ? "" : "none";
      if (tab === "market") loadMarket();
    }
    document.querySelectorAll("#createSeg > div").forEach((el) => {
      el.onclick = () => showTab(el.dataset.tab);
    });

    async function createBlank() {
      const name = $("bName").value.trim();
      if (!name) { toast("请先给 ta 取个名字"); return; }
      $("bSubmit").disabled = true;
      try {
        const detail = await api("/api/personas", { method: "POST", body: JSON.stringify({ name }) });
        window.location.href = "/app/agent/" + detail.persona.id;
      } catch (error) { toast(error.message); $("bSubmit").disabled = false; }
    }
    $("bSubmit").onclick = createBlank;
    $("bName").addEventListener("keydown", (event) => { if (event.key === "Enter") createBlank(); });

    let creditBalance = null;
    let distillCost = 0;
    function renderTicketHint() {
      const hint = $("dTicketHint");
      const button = $("dSubmit");
      if (creditBalance == null) { hint.textContent = ""; button.disabled = false; return; }
      if (distillCost <= 0) {
        button.disabled = false;
        hint.innerHTML = "本次蒸馏免费 · 失败自动退还";
      } else if (creditBalance >= distillCost) {
        button.disabled = false;
        hint.innerHTML = `蒸馏消耗 <b>${distillCost}</b> 积分 · 当前 ${creditBalance} 积分，失败自动退还`;
      } else {
        button.disabled = true;
        hint.innerHTML = `积分不足（需要 ${distillCost}，当前 ${creditBalance}）· <a href="/app/settings" style="color:var(--v);font-weight:650">去充值</a>`;
      }
    }
    async function loadTickets() {
      try {
        const credits = await api("/api/credits");
        creditBalance = Number(credits.balance) || 0;
        distillCost = Number(credits.distill_credit_cost) || 0;
      } catch (error) { creditBalance = null; }
      renderTicketHint();
    }
    function promptNoTicket(message) {
      openModal(
        "积分不足",
        `<div class="mini" style="margin-bottom:12px">${escapeHtml(message || (distillCost > 0 ? "每次蒸馏需要 " + distillCost + " 积分。" : "积分不足。"))}</div>
         <button class="btn primary wide" id="goTickets">前往充值</button>`,
      );
      $("goTickets").onclick = () => { window.location.href = "/app/settings"; };
    }

    let marketLoaded = false;
    async function loadMarket() {
      if (marketLoaded) return;
      marketLoaded = true;
      try {
        const data = await me();
        const presets = data.presets || [];
        $("mList").innerHTML = presets.length
          ? `<div class="preset-grid">${presets.map((preset) => `
              <div class="preset-card" data-id="${preset.id}">
                <div class="n">${escapeHtml(preset.name)}</div>
                <div class="d">${escapeHtml(preset.tagline)}</div>
                <div class="chip-list" style="margin-top:9px">${(preset.tags || []).map((tag) => `<span class="tag-chip">${escapeHtml(tag)}</span>`).join("")}</div>
              </div>`).join("")}</div>`
          : `<section class="glass card empty-state"><div class="t">暂无预置角色</div></section>`;
        $("mList").querySelectorAll("[data-id]").forEach((node) => {
          node.onclick = async () => {
            try {
              const detail = await api("/api/personas/from-preset", { method: "POST", body: JSON.stringify({ preset_id: node.dataset.id }) });
              window.location.href = "/app/agent/" + detail.persona.id;
            } catch (error) { toast(error.message); }
          };
        });
      } catch (error) { marketLoaded = false; toast(error.message); }
    }

    function humanSize(bytes) {
      if (bytes >= 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + " MB";
      if (bytes >= 1024) return (bytes / 1024).toFixed(0) + " KB";
      return bytes + " B";
    }
    function extOf(name) {
      const index = name.lastIndexOf(".");
      return index < 0 ? "" : name.slice(index).toLowerCase();
    }
    function renderList() {
      const host = $("dList");
      if (!files.length) { host.textContent = "系统会自动检测内容格式，无需手动选择。"; return; }
      const total = files.reduce((sum, f) => sum + f.size, 0);
      host.innerHTML = files.map((f) => `${escapeHtml(f.name)} · ${humanSize(f.size)}`).join("<br />")
        + `<br />共 ${files.length} 个文件 · ${humanSize(total)}`;
    }
    function acceptFiles(list) {
      const incoming = Array.from(list || []);
      const rejected = [];
      const kept = [];
      incoming.forEach((file) => {
        if (!ALLOWED.includes(extOf(file.name))) { rejected.push(file.name + "（仅支持 txt / json / jsonl）"); return; }
        if (file.size > MAX_BYTES) { rejected.push(file.name + "（超过 50 MB）"); return; }
        kept.push(file);
      });
      files = kept.slice(0, MAX_FILES);
      if (incoming.length > MAX_FILES) rejected.push(`单次最多 ${MAX_FILES} 个文件`);
      renderList();
      if (rejected.length) toast(rejected[0]);
      else if (kept.length) toast("已选择 " + kept.length + " 个文件");
    }

    const drop = $("dDrop");
    ["dragenter", "dragover"].forEach((type) => drop.addEventListener(type, (event) => {
      event.preventDefault(); drop.classList.add("dragover");
    }));
    drop.addEventListener("dragleave", (event) => { event.preventDefault(); drop.classList.remove("dragover"); });
    drop.addEventListener("drop", (event) => {
      event.preventDefault(); drop.classList.remove("dragover"); acceptFiles(event.dataTransfer.files);
    });
    $("dFile").onchange = (event) => acceptFiles(event.target.files);

    async function submit() {
      const name = $("dName").value.trim();
      if (!name) { toast("请先给 ta 取个名字"); return; }
      if (!files.length) { toast("请先选择聊天记录文件"); return; }
      if (creditBalance != null && distillCost > 0 && creditBalance < distillCost) {
        promptNoTicket(); return;
      }
      const form = new FormData();
      form.append("name", name);
      form.append("target", $("dTarget").value.trim());
      form.append("client_id", ensureClientId());
      files.forEach((file) => form.append("files", file));
      $("dSubmit").disabled = true;
      $("dProgressCard").style.display = "";
      $("dProgress").innerHTML = progressHtml("正在上传");
      setProgress("正在上传", 5);
      try {
        const created = await api("/api/personas/distill", { method: "POST", body: form });
        const task = await pollTask(created.task_id, (t) => { setProgress(t.step, t.progress); $("dPercent").textContent = Math.round(t.progress) + "%"; });
        if (task.status === "error") {
          const failure = new Error(task.error || "蒸馏失败");
          failure.kind = task.error_kind || "";
          throw failure;
        }
        toast("人格已生成");
        window.location.href = "/app/agent/" + created.persona.id;
      } catch (error) {
        const status = error.status || 0;
        if (status === 402 || /积分不足/.test(error.message || "")) {
          toast(error.message || "积分不足");
          setProgress(error.message || "积分不足，请先充值", 0);
          $("dPercent").textContent = "失败";
          promptNoTicket(error.message);
          $("dSubmit").disabled = false;
          $("dSubmit").textContent = "重新尝试";
          await loadTickets();
          return;
        }
        const retryable = ["llm_auth", "llm_rate", "llm_network", "platform_quota", "unknown"].includes(error.kind);
        toast(error.message || String(error));
        $("dPercent").textContent = "失败";
        setProgress((retryable ? "可重试 · " : "") + (error.message || error), 0);
        $("dSubmit").disabled = false;
        $("dSubmit").textContent = "重新尝试";
      }
    }
    $("dSubmit").onclick = submit;
    loadTickets();
    mountTabbar("/app/create/distill");
  </script>
</body>
</html>
