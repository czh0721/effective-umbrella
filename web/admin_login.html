<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#eceef5" />
  <meta name="robots" content="noindex,nofollow" />
  <title>管理后台登录 — 念念</title>
  <link rel="stylesheet" href="/static/app.css" />
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg" />
</head>
<body>
  <div class="auth-wrap">
    <div class="g pad auth-card reveal in">
      <div style="text-align:center;margin:6px 0 20px">
        <div class="brand-mark" style="margin:0 auto 14px">念</div>
        <div class="eyebrow" style="font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3)">Console</div>
        <h1 style="font-size:21px;margin-top:6px">管理后台登录</h1>
        <div class="sub">仅限管理员账号访问</div>
      </div>

      <div id="loginFields">
        <div class="field">
          <label>用户名</label>
          <input id="username" autocomplete="username" placeholder="管理员用户名" />
        </div>
        <div class="field">
          <label>密码</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="密码" />
        </div>
        <div class="field" id="codeField" style="display:none">
          <label>动态验证码</label>
          <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位验证码" />
        </div>
        <button class="btn primary wide" id="submit" style="margin-top:4px">登 录</button>
      </div>

      <div id="setupPanel" style="display:none">
        <div class="sub" style="text-align:center;line-height:1.7;margin-bottom:12px">平台要求管理员启用双因素认证。请在验证器 App 中手动添加以下密钥，再填写 6 位动态验证码完成绑定。</div>
        <div class="field">
          <label>验证器密钥</label>
          <input id="setupSecret" readonly />
        </div>
        <div class="field">
          <label>动态验证码</label>
          <input id="setupCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位验证码" />
        </div>
        <button class="btn primary wide" id="setupSubmit" style="margin-top:4px">完成绑定</button>
      </div>

      <div class="hint" id="msg" style="text-align:center;margin-top:12px;color:var(--red)"></div>
      <p class="mini" style="text-align:center;line-height:1.7;margin-top:16px">
        <a href="/">返回念念首页</a>
      </p>
    </div>
  </div>
  <script src="/static/app.js"></script>
  <script>
    const submit = $("submit");
    const msg = $("msg");

    submit.onclick = async () => {
      const username = $("username").value.trim();
      const password = $("password").value;
      const code = $("code").value.trim();
      if (!username || !password) { msg.textContent = "请填写用户名与密码"; return; }
      submit.disabled = true;
      try {
        if (code) {
          await api("/api/admin/auth/2fa", { method: "POST", body: JSON.stringify({ code }) });
          window.location.href = "/admin";
          return;
        }
        const data = await api("/api/admin/auth/login", {
          method: "POST",
          body: JSON.stringify({ username, password }),
        });
        if (data.totp_required) {
          $("codeField").style.display = "";
          $("code").focus();
          msg.textContent = "请输入验证器动态验证码";
          msg.style.color = "";
          return;
        }
        if (data.totp_setup_required) {
          await showSetup();
          return;
        }
        window.location.href = "/admin";
      } catch (error) {
        msg.textContent = error.message;
      } finally {
        submit.disabled = false;
      }
    };

    async function showSetup() {
      try {
        const data = await api("/api/admin/account/2fa/setup", { method: "POST" });
        $("setupSecret").value = data.secret;
        $("loginFields").style.display = "none";
        $("setupPanel").style.display = "";
        msg.textContent = "请先完成双因素绑定";
        msg.style.color = "";
        $("setupCode").focus();
      } catch (error) {
        msg.textContent = error.message;
      }
    }

    $("setupSubmit").onclick = async () => {
      const code = $("setupCode").value.trim();
      if (code.length !== 6) { msg.textContent = "请输入 6 位动态验证码"; return; }
      $("setupSubmit").disabled = true;
      try {
        await api("/api/admin/account/2fa/enable", {
          method: "POST",
          body: JSON.stringify({ code }),
        });
        window.location.href = "/admin";
      } catch (error) {
        msg.textContent = error.message;
      } finally {
        $("setupSubmit").disabled = false;
      }
    };
    $("setupCode").addEventListener("keydown", (event) => { if (event.key === "Enter") $("setupSubmit").click(); });

    $("password").addEventListener("keydown", (event) => { if (event.key === "Enter") submit.click(); });
    $("username").addEventListener("keydown", (event) => { if (event.key === "Enter") submit.click(); });
    $("code").addEventListener("keydown", (event) => { if (event.key === "Enter") submit.click(); });
    $("username").focus();
  </script>
</body>
</html>
