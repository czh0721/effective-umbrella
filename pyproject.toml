[project]
name = "nian"
version = "0.2.0"
description = "念念 Nian - 多用户人格对话平台"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["data", ".monkeycode", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
